let _assignPick='';
// ══════════════════════════════════════════════════════════
// _evalCandidates: 共用候選人評估 + 排序邏輯
// 優先順序：非派工 > 有prefTool > AUTO技能 > 技能數少 > 可用
// site 限制：已排他site的人不可選（disabled）
// ══════════════════════════════════════════════════════════
function _evalCandidates({candidates, tool, tsk, cost, isAuto, cur,
    ptc, pac, psite, pdispUsed, sfPfx, dateStr, isDisp, dispSite}){
  const isManual=(cost>=1);
  return candidates.map(mem=>{
    const tc=ptc[mem.name]||0, ac2=pac[mem.name]||0, mc=tc-ac2;
    const msite=psite[mem.name]||null;
    const isDispMem=pdispUsed.has(mem.name);
    const actualPl=memberPower(mem)-(ac2*0.5)-(mc*1.0)-(isDispMem?0.5:0); // 派工消耗0.5，剩0.5可接一手動機台
    const effectiveCost=(isManual&&ac2>=1)?Math.min(cost,actualPl):cost;
    // isOT 由 caller 決定（map 後加）
    const isPref=!isDisp&&(mem.prefTool||[]).includes(tool?.id||'');
    const hasAutoSkill2=hasAutoSkill(mem);
    const skillCount=(mem.skills||[]).filter(s=>!['派工','代理','雙棲'].includes(s)).length;
    const reasons=[];
    if(isDisp){
      if(!(mem.skills||[]).some(s=>['派工','代理'].includes(s))) reasons.push('無派工技能');
      else{
        if(isDispMem&&mem.name!==cur) reasons.push('已派工');
        if(actualPl<1&&mem.name!==cur) reasons.push('人力不足');
      }
    } else {
      if(!tsk.some(sk=>(mem.skills||[]).includes(sk))) reasons.push('技能不符');
      else{
        if(tc>=2&&mem.name!==cur) reasons.push('已排2機');
        if(actualPl<effectiveCost&&mem.name!==cur) reasons.push(`人力不足(${actualPl.toFixed(1)})`);
        if(msite&&msite!==tool.site&&mem.name!==cur) reasons.push(`site衝突(${msite}≠${tool.site})`);
        if(isAuto&&ac2>=1&&mem.name!==cur) reasons.push('已有auto機');
        if(!isAuto&&mc>=1&&mem.name!==cur) reasons.push('已有手動機');
        if(isDispMem&&actualPl<effectiveCost&&mem.name!==cur) reasons.push('人力已用於派工');
      }
    }
    const disabled=reasons.length>0&&mem.name!==cur;
    return {mem,disabled,reasons,isPref,hasAutoSkill:hasAutoSkill2,skillCount,tc,ac2,mc,actualPl};
  }).sort((a,b)=>{
    // disabled 排後
    if(a.disabled!==b.disabled) return a.disabled?1:-1;
    // 優先順序（可用人員內部）：
    // 1. 已有prefTool指定優先（配對完整度）
    if(a.isPref!==b.isPref) return a.isPref?-1:1;
    // 2. 有AUTO技能優先（彈性較大）
    if(a.hasAutoSkill!==b.hasAutoSkill) return a.hasAutoSkill?-1:1;
    // 3. 技能數少的優先（資源稀缺性）
    if(a.skillCount!==b.skillCount) return a.skillCount-b.skillCount;
    // 4. 已排機台數少的優先（平衡負載）
    return a.tc-b.tc;
  });
}


function assignTool(toolId,dateStr,sf){
  sf=sf||_p3ShiftFilter;
  const pairSf=pairShiftOf(sf);
  const tool=S.tools.find(t=>t.id===toolId);
  const d=pd(dateStr);
  const tskills=tool.skills||[tool.skill]||[];
  const cost=toolCost(tool);
  const isAutoTool=toolIsAuto(tool);
  const sfPfx=sf+'_';

  // 目前分配值
  const cur=S.toolAssign[taKey(sf,toolId,dateStr)]||S.pendingAssign[taKey(sf,toolId,dateStr)]||'';

  // 計算每人已排機台數、auto數、site、派工佔用
  const personToolCount={}, personAutoCount={}, personSite={};
  for(const obj of [S.toolAssign, S.pendingAssign]){
    for(const [k,v] of Object.entries(obj)){
      if(!k.startsWith(sfPfx)||!k.endsWith('_'+dateStr)||!v||v==='空機'||v==='停機') continue;
      const tid=k.slice(sfPfx.length, k.length-dateStr.length-1);
      const t=S.tools.find(x=>x.id===tid); if(!t) continue;
      personToolCount[v]=(personToolCount[v]||0)+1;
      if(toolIsAuto(t)) personAutoCount[v]=(personAutoCount[v]||0)+1;
      personSite[v]=t.site;
    }
  }
  // 派工佔用（pendingDispatch 草稿優先，同步記錄 personSite）
  const pdispUsed_at=new Set();
  ['P2','P6','P8'].forEach(s2=>{
    const v=S.pendingDispatch?.[sfPfx+s2+'_'+dateStr]??S.dispatchAssign?.[sfPfx+s2+'_'+dateStr]??'';
    if(v&&v!=='空機'){
      pdispUsed_at.add(v);
      personSite[v]=s2; // 派工鎖定此人的 site（覆蓋機台 site，派工優先）
    }
  });
  // 候選人：當班（sf）出勤 + 對班（pairSf）有 phase2 加班
  const candidates=S.members.filter(mem=>{
    if(mem.shift===sf){
      const s=getStatus(mem.name,d);
      return s.base==='work' && isActuallyWorking(s,dateStr);
    }
    if(mem.shift===pairSf){
      if(shiftWork(d,mem.shift)!=='off') return false;
      if(!S.phase2[mem.name+'_'+dateStr]) return false;
      // 有 phase2 加班但也有 phase1 請假 → 不出勤
      const s2=getStatus(mem.name,d);
      return isActuallyWorking(s2,dateStr);
    }
    return false;
  });

  // 用共用 _evalCandidates 評估候選人（優先順序：prefTool > AUTO > 技能少 > 平衡）
  // 傳入前先過濾 site 衝突：personSite 已鎖定他 site 的人，完全不顯示在選單
  const candidatesFiltered=candidates.filter(mem=>{
    if(mem.name===cur) return true; // 目前已選的人永遠顯示
    const msite=personSite[mem.name];
    if(msite && msite!==tool.site) return false; // 已在其他 site，排除
    return true;
  });
  const rows=_evalCandidates({
    candidates:candidatesFiltered, tool, tsk:tskills, cost, isAuto:isAutoTool, cur,
    ptc:personToolCount, pac:personAutoCount, psite:personSite,
    pdispUsed:pdispUsed_at, sfPfx, dateStr, isDisp:false
  }).map(r=>({...r, isOT:r.mem.shift===pairSf}));
  _assignPick=cur;
  const html=rows.map(({mem,disabled,reasons,isOT,isPref,hasAutoSkill:haA,skillCount,tc,ac2})=>{
    const sel=cur===mem.name;
    const tag=isOT?`<span style="font-size:8px;color:#16a34a;font-weight:700">加班</span>`
                  :`<span style="font-size:8px;color:#2563eb;font-weight:700">${mem.shift}</span>`;
    const prefTag=isPref?' <span style="font-size:8px;color:#d97706">★</span>':'';
    const autoTag=haA?'<span style="font-size:8px;color:#7c3aed">A</span>':'';
    const tcTag=tc>0?`<span style="font-size:8px;color:#64748b">${tc}機</span>`:'';
    const reasonTag=disabled?`<span style="font-size:8px;color:#ef4444;display:block">${reasons[0]}</span>`:'';
    const cls=`obtn${sel?' sel':''}${disabled?' disabled':''}${isPref?' s-annual':''}`;
    const onclick=disabled?'':`onclick="pickAssign('${mem.name}',this)"`;
    return `<div class="${cls}" ${onclick} style="${disabled?'opacity:0.45;cursor:not-allowed;':''}">
      <div style="display:flex;justify-content:space-between;align-items:center">${tag}${prefTag}${autoTag}${tcTag}</div>
      <div style="font-size:11px;font-weight:600;line-height:1.3">${mem.name}</div>
      ${reasonTag}
    </div>`;
  }).join('');;

  OM(`分配 ${tool.id} — ${dateStr}`,`
    <div class="minfo"><b>技能：</b>${tskills.join('/')}　<b>cost：</b>${cost}　<b>目前：</b>${cur||'未分配'}</div>
    <div class="ogrid ogrid3" id="assignOpts">
      ${html||'<div style="grid-column:1/-1;color:#999;font-size:12px;padding:6px;text-align:center">⚠ 無可用人員</div>'}
      ${cur?`<div class="obtn" onclick="pickAssign('',this)" style="border-color:#fca5a5;color:#ef4444">✕ 清除</div>`:''}
    </div>`,
    `<button class="btn btn-ghost" onclick="CM()">取消</button><button class="btn btn-primary" onclick="doAssignTool('${toolId}','${dateStr}')">暫存草稿</button>`); _assignSf=sf;
}
function pickAssign(v,el){_assignPick=v;document.querySelectorAll('#assignOpts .obtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
let _assignSf='';
function doAssignTool(toolId,dateStr){
  if(!S.pendingAssign) S.pendingAssign={};
  const sf=_assignSf||_p3ShiftFilter;
  const k=taKey(sf,toolId,dateStr);
  if(_assignPick){
    S.pendingAssign[k]=_assignPick;
  } else {
    delete S.pendingAssign[k];
    delete S.toolAssign[k];
  }
  LS_save();CM();renderAdminTab();toast(_assignPick?'已暫存草稿（請按確認儲存）':'已清除','info');
}

// 確認儲存：把 pendingAssign 寫入 toolAssign，並對新增加班人員寫 phase2，同時七天連班檢查
function commitAssign(){
  if(!S.pendingAssign && !S.pendingDispatch) return;
  // 機台草稿 → toolAssign
  Object.entries(S.pendingAssign||{}).forEach(([k,v])=>{
    S.toolAssign[k]=v;
    delete S.pendingAssign[k];
  });
  // 派工草稿 → dispatchAssign
  if(!S.dispatchAssign) S.dispatchAssign={};
  Object.entries(S.pendingDispatch||{}).forEach(([k,v])=>{
    S.dispatchAssign[k]=v;
    delete S.pendingDispatch[k];
  });
  LS_save(); renderAdminTab(); toast('✅ 分配（含派工）已確認儲存','ok');
}
function clearAssign(){
  const sf=_p3ShiftFilter;
  if(!confirm(`確定清除 ${sf} 班本月所有人機安排？（包含草稿）`))return;
  const {y,m}=S.schedMonth; const days=monthDays(y,m);
  if(!S.pendingAssign) S.pendingAssign={};
  days.forEach(d=>{
    const dateStr=dk(d);
    S.tools.forEach(tool=>{
      delete S.toolAssign[taKey(sf,tool.id,dateStr)];
      delete S.pendingAssign[taKey(sf,tool.id,dateStr)];
    });
  });
  LS_save();renderAdminTab();toast(`已清除 ${sf} 班人機安排`,'info');
}


function assignDispatch(site, dateStr){
  if(!S.dispatchAssign) S.dispatchAssign={};
  const sf=_p3ShiftFilter;
  const dpKey=sf+'_'+site+'_'+dateStr;
  const cur=S.dispatchAssign[dpKey]||'';
  const d=pd(dateStr);
  const pairSf=pairShiftOf(sf);
  const sfPfx=sf+'_';

  // 計算每人已消耗人力（機台 + 其他站點派工）
  const usedPower={};
  S.tools.filter(t=>(t.status||'auto')!=='off').forEach(t=>{
    const v=S.toolAssign[sfPfx+t.id+'_'+dateStr]||S.pendingAssign[sfPfx+t.id+'_'+dateStr]||'';
    if(v&&v!=='空機'&&v!=='停機') usedPower[v]=(usedPower[v]||0)+toolCost(t);
  });
  ['P2','P6','P8'].filter(s2=>s2!==site).forEach(s2=>{
    // 優先讀草稿，再讀已儲存的
    const v=S.pendingDispatch?.[sfPfx+s2+'_'+dateStr]??S.dispatchAssign[sfPfx+s2+'_'+dateStr]??'';
    if(v&&v!=='空機') usedPower[v]=(usedPower[v]||0)+1;
  });

  // 候選人：有派工/代理技能 + 實際出勤
  const candidates=S.members.filter(mem=>{
    if(mem.shift!==sf&&mem.shift!==pairSf) return false;
    if(!(mem.skills||[]).some(sk=>['派工','代理'].includes(sk))) return false;
    const s=getStatus(mem.name,d);
    if(mem.shift===sf) return s.base==='work'&&isActuallyWorking(s,dateStr);
    if(!(S.phase2[mem.name+'_'+dateStr]||S.p3Requests?.[mem.name+'_'+dateStr])) return false;
    return isActuallyWorking(s,dateStr);
  });

  // 評估並排序：1.當班派工 2.加班派工 3.當班代理 4.加班代理
  const rows=candidates.map(mem=>{
    const isOT=mem.shift===pairSf;
    const isDispatch=(mem.skills||[]).includes('派工');
    const maxPl=memberPower(mem);
    const used=usedPower[mem.name]||0;
    const remaining=+(maxPl-used).toFixed(1);
    const isCur=cur===mem.name;
    const disabled=!isCur&&remaining<0.5; // 派工消耗0.5，只需剩0.5即可
    const reason=disabled?(used>=maxPl?'人力已用盡':`人力不足(${remaining})`):null;
    return {mem,isOT,isDispatch,disabled,reason,remaining};
  }).sort((a,b)=>{
    if(a.disabled!==b.disabled) return a.disabled?1:-1;
    const ra=(a.isOT?2:0)+(a.isDispatch?0:1);
    const rb=(b.isOT?2:0)+(b.isDispatch?0:1);
    if(ra!==rb) return ra-rb;
    return b.remaining-a.remaining;
  });

  const optHtml=rows.map(({mem,isOT,isDispatch,disabled,reason,remaining})=>{
    const isCur=cur===mem.name;
    const cls='obtn'+(isCur?' sel':'')+(disabled?' disabled':'');
    const onclick=disabled?'':`onclick="pickAssign('${mem.name}',this)"`;
    const roleTag=isDispatch
      ?'<span style="font-size:8px;color:#1d4ed8;background:#dbeafe;padding:0 2px;border-radius:2px">派工</span>'
      :'<span style="font-size:8px;color:#6d28d9;background:#ede9fe;padding:0 2px;border-radius:2px">代理</span>';
    const otTag=isOT?'<span style="font-size:8px;color:#16a34a">加班</span>':'';
    const plTag=`<span style="font-size:8px;color:${disabled?'#ef4444':'#64748b'}">${remaining}力</span>`;
    return `<div class="${cls}" ${onclick} style="${disabled?'opacity:0.45;cursor:not-allowed;':''}">
      <div style="display:flex;gap:2px;flex-wrap:wrap">${roleTag}${otTag}${plTag}</div>
      <div style="font-size:11px;font-weight:600">${mem.name}</div>
      ${reason?`<div style="font-size:8px;color:#ef4444">${reason}</div>`:''}
    </div>`;
  }).join('');

  _assignPick=cur&&cur!=='空機'?cur:'空機';
  OM(`派工 ${site} — ${dateStr}`,
    `<div class="minfo"><b>站點：</b>${site}　<b>目前：</b>${cur||'未指定'}</div>
    <div class="ogrid ogrid3" id="dpOpts">
      ${optHtml||'<div style="grid-column:1/-1;color:#999;font-size:12px;padding:6px;text-align:center">無符合人員</div>'}
      <div class="obtn${!cur||cur==='空機'?' sel':''}" onclick="pickAssign('空機',this)" style="border-color:#fca5a5;color:#ef4444">✕ 空機</div>
    </div>`,
    `<button class="btn btn-ghost" onclick="CM()">取消</button><button class="btn btn-primary" onclick="doAssignDispatch('${site}','${dateStr}')">確定</button>`);
}

function doAssignDispatch(site,dateStr){
  if(!S.pendingDispatch) S.pendingDispatch={};
  const sf=_p3ShiftFilter;
  const dpKey=sf+'_'+site+'_'+dateStr;
  S.pendingDispatch[dpKey]=_assignPick||'空機';
  LS_save();CM();renderAdminTab();toast('派工草稿已更新（💾 儲存後生效）','ok');
}
function clearAllAssign(){
  // 使用 OM modal 確認，避免 confirm 在某些環境被阻擋
  OM('🗑 清空機台分配',
    `<div style="padding:8px;color:#dc2626;font-weight:600">確定清空所有機台分配（含草稿和已確認）？</div>
     <div style="padding:4px 8px;font-size:12px;color:#666">目前已確認：${Object.keys(S.toolAssign).length} 筆，草稿：${Object.keys(S.pendingAssign||{}).length} 筆</div>`,
    `<button class="btn btn-ghost" onclick="CM()">取消</button>
     <button class="btn btn-danger" onclick="_doClrAssign()">確定清空</button>`

}
function _doClrAssign(){
  S.toolAssign={};
  if(!S.pendingAssign) S.pendingAssign={};
  Object.keys(S.pendingAssign).forEach(k=>delete S.pendingAssign[k]);
  if(!S.dispatchAssign) S.dispatchAssign={};
  Object.keys(S.dispatchAssign).forEach(k=>delete S.dispatchAssign[k]);
  LS_save(); CM(); renderAdminTab();
  toast('✅ 已清空所有機台分配','ok');
}

function cancelAutoAssign(){
  const hasPend=Object.keys(S.pendingAssign||{}).length>0;
  const hasDispPend=Object.keys(S.pendingDispatch||{}).length>0;
  if(!hasPend&&!hasDispPend){ toast('無草稿可取消','info'); return; }
  S.pendingAssign={};
  S.pendingDispatch={};
  LS_save(); renderAdminTab(); toast('已取消草稿（機台 + 派工）','info');
}
function autoAssign(){
  if(!S.pendingAssign) S.pendingAssign={};
  if(!S.dispatchAssign)  S.dispatchAssign={};
  if(!S.pendingDispatch)  S.pendingDispatch={};
  const {y,m}=S.schedMonth; const allDays=monthDays(y,m);
  const days=getShiftDays(allDays,_p3ShiftFilter);
  const sf=_p3ShiftFilter;
  const pairSf=pairShiftOf(sf);
  const sfPfx=sf+'_';
  let cnt=0, skip=0;

  days.forEach(d=>{
    const dateStr=dk(d);
    const powerLeft={}, toolCount={}, autoCount={};

    const initPower=(mem)=>{
      if(powerLeft[mem.name]!==undefined) return;
      powerLeft[mem.name]=memberPower(mem);
      toolCount[mem.name]=0;
      autoCount[mem.name]=0;
    };

    // 已確認分配計入人力
    Object.entries(S.toolAssign).forEach(([k,v])=>{
      if(!k.startsWith(sfPfx)||!k.endsWith('_'+dateStr)||!v||v==='空機'||v==='停機') return;
      const toolId=k.slice(sfPfx.length,k.length-dateStr.length-1);
      const tool=S.tools.find(x=>x.id===toolId); if(!tool) return;
      const mem=S.members.find(x=>x.name===v); if(!mem) return;
      initPower(mem);
      powerLeft[mem.name]=Math.max(0,powerLeft[mem.name]-toolCost(tool));
      toolCount[mem.name]++;
      if(toolIsAuto(tool)) autoCount[mem.name]++;
    });

    // 候選池
    const onDuty=S.members.filter(mem=>{
      if(mem.shift!==sf||(mem.skills||[]).includes('雙棲')) return false;
      const s=getStatus(mem.name,d);
      return s.base==='work'&&isActuallyWorking(s,dateStr);
    });
    const otDuty=S.members.filter(mem=>{
      if(mem.shift!==pairSf||(mem.skills||[]).includes('雙棲')) return false;
      if(shiftWork(d,mem.shift)!=='off') return false;
      return !!S.phase2[mem.name+'_'+dateStr];
    });
    // 雙棲：必須是 sf 班（不接受其他班的雙棲人員）
    const dualRole=S.members.filter(mem=>{
      if(mem.shift!==sf) return false;          // ← 嚴格限制本班
      if(!(mem.skills||[]).includes('雙棲')) return false;
      const s=getStatus(mem.name,d);
      return s.base==='work'&&isActuallyWorking(s,dateStr);
    });
    [...onDuty,...otDuty,...dualRole].forEach(m=>initPower(m));

    // 派工：多輪掃描，同 site 優先，確保有資源的站點不被搶走
    // 優先順序：
    //   Round 1: 同site 當班派工
    //   Round 2: 同site 加班派工（優先給沒排到的站點）
    //   Round 3: 不同site 加班派工
    //   Round 4: 同site 當班代理
    //   Round 5: 同site 加班代理
    //   Round 6: 不同site 當班代理
    //   Round 7: 不同site 加班代理
    const DISP_SITES_AUTO=['P2','P6','P8'];
    const usedNames=new Set();
    const dpAssigned={}; // site→name，本次已排的

    // 先沿用已有草稿/已儲存
    DISP_SITES_AUTO.forEach(site=>{
      const dpKey=sf+'_'+site+'_'+dateStr;
      const existing=S.pendingDispatch[dpKey]??S.dispatchAssign[dpKey];
      if(existing&&existing!=='空機'){
        dpAssigned[site]=existing;
        usedNames.add(existing);
        const mem=S.members.find(x=>x.name===existing);
        if(mem){initPower(mem);powerLeft[mem.name]=Math.max(0,powerLeft[mem.name]-0.5);} // 派工消耗0.5
      }
    });

    const needSites=DISP_SITES_AUTO.filter(s=>!dpAssigned[s]);
    if(needSites.length>0){
      const all=[...onDuty,...otDuty];
      // 找符合條件的人（未使用）
      const findOne=(isOT,skill,site,sameSite)=>
        all.find(m=>!usedNames.has(m.name)
          &&m.shift===(isOT?pairSf:sf)
          &&(m.skills||[]).includes(skill)
          &&(sameSite?(m.site===site):(m.site!==site)));

      // 七輪依序，每輪只排還沒排到的站點
      const rounds=[
        (site)=>findOne(false,'派工',site,true),   // 1. 同site 當班派工
        (site)=>findOne(true, '派工',site,true),   // 2. 同site 加班派工
        (site)=>findOne(true, '派工',site,false),  // 3. 不同site 加班派工
        (site)=>findOne(false,'代理',site,true),   // 4. 同site 當班代理
        (site)=>findOne(true, '代理',site,true),   // 5. 同site 加班代理
        (site)=>findOne(false,'代理',site,false),  // 6. 不同site 當班代理
        (site)=>findOne(true, '代理',site,false),  // 7. 不同site 加班代理
      ];

      rounds.forEach(roundFn=>{
        // 每輪掃描所有還沒排到的站點
        needSites.filter(s=>!dpAssigned[s]).forEach(site=>{
          const cand=roundFn(site);
          if(!cand) return;
          dpAssigned[site]=cand.name;
          usedNames.add(cand.name);
          const dpKey=sf+'_'+site+'_'+dateStr;
          S.pendingDispatch[dpKey]=cand.name;
          initPower(cand);
          powerLeft[cand.name]=Math.max(0,powerLeft[cand.name]-0.5); // 派工消耗0.5
        });
      });

      // 真的找不到的標空機
      needSites.filter(s=>!dpAssigned[s]).forEach(site=>{
        S.pendingDispatch[sf+'_'+site+'_'+dateStr]='空機';
      });
    }

    const getUsed=()=>{
      const s=new Set(usedNames);
      for(const obj of [S.toolAssign,S.pendingAssign])
        for(const [k,v] of Object.entries(obj))
          if(k.startsWith(sfPfx)&&k.endsWith('_'+dateStr)&&v&&v!=='空機'&&v!=='停機') s.add(v);
      return s;
    };

    // 已排派工的人名（在機台分配中最後才排入）
    const dispNames=new Set();
    ['P2','P6','P8'].forEach(s2=>{
      const v=S.pendingDispatch?.[sfPfx+s2+'_'+dateStr]??S.dispatchAssign[sfPfx+s2+'_'+dateStr]??'';
      if(v&&v!=='空機') dispNames.add(v);
    });

    const assignedSite=(name)=>{
      // 先查已排機台 site
      for(const obj of [S.toolAssign,S.pendingAssign])
        for(const [k,v] of Object.entries(obj)){
          if(v!==name||!k.startsWith(sfPfx)||!k.endsWith('_'+dateStr)) continue;
          const tid=k.slice(sfPfx.length,k.length-dateStr.length-1);
          const t=S.tools.find(x=>x.id===tid);
          if(t) return t.site;
        }
      // 再查派工站點（派工鎖定 site，機台也必須同 site）
      for(const s2 of ['P2','P6','P8']){
        const v=S.pendingDispatch?.[sfPfx+s2+'_'+dateStr]??S.dispatchAssign[sfPfx+s2+'_'+dateStr]??'';
        if(v===name) return s2;
      }
      return null;
    };

    const doAssign=(moKey,mem,tool)=>{
      const cost=toolCost(tool);
      S.pendingAssign[moKey]=mem.name;
      powerLeft[mem.name]=Math.max(0,powerLeft[mem.name]-cost);
      toolCount[mem.name]++;
      if(toolIsAuto(tool)) autoCount[mem.name]++;
      cnt++;
    };

    // ══════════════════════════════════════════════════════
    // findCand：通用候選篩選
    // mode:
    //   'auto_first'  → auto機台第一輪：此人尚未排任何auto（預留配對名額）
    //   'manual_pair' → 手動機台配對：優先已排auto的人，無則找空手人員
    //   'auto_second' → auto機台第二輪：允許已有auto的人再排（人力用盡為止）
    //   'manual_fill' → 手動機台補滿：允許已有手動的人再排第二台手動
    // ══════════════════════════════════════════════════════
    const findCand=(pool,tskills,cost,toolSite,mode,allowDual=false)=>{
      const used=getUsed();
      const base=pool.filter(mem=>{
        if(!allowDual&&(mem.skills||[]).includes('雙棲')) return false;
        if(!tskills.some(sk=>(mem.skills||[]).includes(sk))) return false;
        const ac=autoCount[mem.name]||0;
        const mc=(toolCount[mem.name]||0)-ac;
        // 已排 auto（ac>=1）時，手動機台 effectiveCost = min(cost, powerLeft)
        // 這讓 pl=0.5 的人可以接手動機台完成 1auto+1manual 配對
        const isManual=(cost>=1);
        const effectiveCost=(isManual && ac>=1)
          ? Math.min(cost, powerLeft[mem.name]||0)
          : cost;
        if((powerLeft[mem.name]||0)<effectiveCost) return false;
        if((toolCount[mem.name]||0)>=2) return false;
        const ms=assignedSite(mem.name);
        if(ms&&ms!==toolSite) return false; // 同site限制
        switch(mode){
          case 'auto_first':
            if(used.has(mem.name)) return false;
            if(ac>=1) return false;
            return true;
          case 'manual_pair':
            if(mc>=1) return false;
            return true;
          case 'auto_second':
            if(used.has(mem.name)) return false;
            return true;
          case 'manual_fill':
            return true;
          default:
            return true;
        }
      });
      if(!base.length) return null;
      // 排序策略：已排派工的人最後才排入機台（留給非派工的人先用）
      const sortDisp=(arr)=>arr.sort((a,b)=>{
        const da=dispNames.has(a.name)?1:0, db=dispNames.has(b.name)?1:0;
        return da-db;
      });
      if(mode==='manual_pair'||mode==='manual_fill'){
        // 優先：已有auto的人（完成1auto+1manual配對），派工人員最後
        const sorted=sortDisp([...base]);
        const paired=sorted.filter(m=>(autoCount[m.name]||0)>=1);
        return paired.length ? paired[0] : sorted[0];
      }
      if(mode==='auto_first'||mode==='auto_second'){
        // 優先：toolCount最小的人（最空），派工人員最後
        return sortDisp(base.sort((a,b)=>(toolCount[a.name]||0)-(toolCount[b.name]||0)))[0];
      }
      return sortDisp([...base])[0];
    };

    const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');

    // ── 步驟1：prefTool 指定 ──
    allActive.forEach(tool=>{
      const moKey=taKey(sf,tool.id,dateStr);
      if(S.machineOff[tool.id+'_'+dateStr]){S.pendingAssign[moKey]='停機';return;}
      if(S.toolAssign[moKey]||S.pendingAssign[moKey]) return;
      const tskills=tool.skills||[]; const cost=toolCost(tool);
      const used=getUsed();
      const pref=[...onDuty,...otDuty].find(m=>{
        if((m.skills||[]).includes('雙棲')) return false;
        if(!(m.prefTool||[]).includes(tool.id)) return false;
        if(!tskills.some(sk=>(m.skills||[]).includes(sk))) return false;
        if((powerLeft[m.name]||0)<cost||(toolCount[m.name]||0)>=2) return false;
        const ms=assignedSite(m.name); if(ms&&ms!==tool.site) return false;
        const ac=autoCount[m.name]||0; const mc=(toolCount[m.name]||0)-ac;
        if(toolIsAuto(tool)&&used.has(m.name)) return false;
        if(!toolIsAuto(tool)&&mc>=1) return false; // prefTool手動也守配對原則
        return true;
      });
      if(pref) doAssign(moKey,pref,tool);
    });

    // ── 步驟2~5：四個 Pass，最大化機台覆蓋 ──
    // ── 排機台：P2+P8 → P7先排1人 → P6補滿 → P7補滿 ──
    // 工具函數：對單一站點執行 4 個 pass
    const runPasses=(siteTools,limitFirst=null)=>{
      const autoT=siteTools.filter(t=>toolIsAuto(t));
      const manualT=siteTools.filter(t=>!toolIsAuto(t));
      const passes=[
        ['auto_first', autoT],
        ['manual_pair', manualT],
        ['auto_second', autoT],
        ['manual_fill', manualT],
      ];
      passes.forEach(([mode,tlist])=>{
        let count=0;
        tlist.forEach(tool=>{
          if(limitFirst!==null && count>=limitFirst) return; // P7 第一輪限制1台
          const moKey=taKey(sf,tool.id,dateStr);
          if(S.machineOff[tool.id+'_'+dateStr]){S.pendingAssign[moKey]='停機';return;}
          const isRefill=mode==='auto_second'||mode==='manual_fill';
          if(isRefill&&(S.pendingAssign[moKey]||S.toolAssign[moKey])!=='空機') return;
          if(!isRefill&&(S.toolAssign[moKey]||S.pendingAssign[moKey])) return;
          const tskills=tool.skills||[]; const cost=toolCost(tool);
          const cand=
            findCand(onDuty.filter(m=>m.site===tool.site),tskills,cost,tool.site,mode)||
            findCand(otDuty.filter(m=>m.site===tool.site),tskills,cost,tool.site,mode)||
            findCand(onDuty,tskills,cost,tool.site,mode)||
            findCand(otDuty,tskills,cost,tool.site,mode);
          if(cand){
            if(isRefill) delete S.pendingAssign[moKey];
            doAssign(moKey,cand,tool);
            if(isRefill) skip--;
            count++;
          } else if(!isRefill){
            S.pendingAssign[moKey]='空機'; skip++;
          }
        });
      });
    };

    const p2p8Tools=allActive.filter(t=>!toolIsRemote(t)&&['P2','P8'].includes(t.site));
    const p7Tools   =allActive.filter(t=>!toolIsRemote(t)&&t.site==='P7');
    const p6Tools   =allActive.filter(t=>!toolIsRemote(t)&&t.site==='P6');

    // 判斷 P7 是否已有「指定機台」或「已確認分配」的人員
    // 若有 → 已滿足至少1人，limitFirst=0（略過第一輪，直接讓 P6 先排）
    // 若無 → limitFirst=1（先搶 1 人卡位）
    const p7AlreadyHasOne=p7Tools.some(tool=>{
      const moKey=taKey(sf,tool.id,dateStr);
      // 已確認分配
      if(S.toolAssign[moKey]&&S.toolAssign[moKey]!=='空機'&&S.toolAssign[moKey]!=='停機') return true;
      // prefTool 指定（步驟1已排入 pendingAssign）
      if(S.pendingAssign[moKey]&&S.pendingAssign[moKey]!=='空機'&&S.pendingAssign[moKey]!=='停機') return true;
      return false;
    });
    const p7Limit=p7AlreadyHasOne ? 0 : 1;

    // 1. P2+P8 全排
    runPasses(p2p8Tools);
    // 2. P7 先排（若已有人則 limit=0 跳過，否則搶 1 人卡位）
    if(p7Limit>0) runPasses(p7Tools, p7Limit);
    // 3. P6 全排
    runPasses(p6Tools);
    // 4. P7 補滿剩餘空機
    runPasses(p7Tools);


    // ── 步驟6：雙棲補空機 ──
    allActive.filter(t=>!toolIsRemote(t)).forEach(tool=>{
      const moKey=taKey(sf,tool.id,dateStr);
      if((S.pendingAssign[moKey]||S.toolAssign[moKey])!=='空機') return;
      const tskills=tool.skills||[]; const cost=toolCost(tool);
      const mode=toolIsAuto(tool)?'auto_second':'manual_fill';
      const cand=findCand(dualRole,tskills,cost,tool.site,mode,true);
      if(cand){ delete S.pendingAssign[moKey]; doAssign(moKey,cand,tool); skip--; }
    });

    // ── 步驟7：Remote 無指定 → 空機 ──
    allActive.filter(t=>toolIsRemote(t)).forEach(tool=>{
      const moKey=taKey(sf,tool.id,dateStr);
      if(S.machineOff[tool.id+'_'+dateStr]){S.pendingAssign[moKey]='停機';return;}
      if(!S.toolAssign[moKey]&&!S.pendingAssign[moKey]){S.pendingAssign[moKey]='空機';skip++;}
    });
  });

  // ── Pass E：剩餘人力補空機 ──
  // 邏輯：
  //   第一輪：只排「尚未被分配到任何機台」的人（tc=0），放寬2機上限
  //   第二輪：若還有空機，允許所有有剩餘人力的人再排（包含已有機台的人）
  const {y:ye,m:me}=S.schedMonth; const allDays2=monthDays(ye,me);
  const sfDays=allDays2.filter(d=>shiftWork(d,sf)==='work');
  sfDays.forEach(d=>{
    const dateStr=dk(d);
    const sfPfx2=sf+'_';

    // ── 重算當日每人人力剩餘 ──
    const pl2={}, tc2={}, ac2={};
    const pairSf2=pairShiftOf(sf);
    const allPeople2=[
      ...S.members.filter(m=>m.shift===sf&&!(m.skills||[]).includes('雙棲')&&(()=>{const s=getStatus(m.name,d);return s.base==='work'&&isActuallyWorking(s,dateStr);})()),
      ...S.members.filter(m=>{
        if(m.shift!==pairSf2||(m.skills||[]).includes('雙棲'))return false;
        const s=getStatus(m.name,d);
        if(shiftWork(d,m.shift)!=='off')return false;
        return !!(S.phase2[m.name+'_'+dateStr]||S.p3Requests?.[m.name+'_'+dateStr])&&isActuallyWorking(s,dateStr);
      }),
    ];
    allPeople2.forEach(m=>{pl2[m.name]=memberPower(m);tc2[m.name]=0;ac2[m.name]=0;});
    // 扣除派工人力
    ['P2','P6','P8'].forEach(site=>{
      const v=S.pendingDispatch?.[sfPfx2+site+'_'+dateStr]??S.dispatchAssign[sfPfx2+site+'_'+dateStr]??'';
      if(v&&v!=='空機') pl2[v]=Math.max(0,(pl2[v]||0)-0.5); // 派工消耗0.5
    });
    // 計算已用人力
    S.tools.filter(t=>(t.status||'auto')!=='off').forEach(t=>{
      const mk=sfPfx2+t.id+'_'+dateStr;
      const v=S.pendingAssign[mk]||S.toolAssign[mk]||'';
      if(!v||v==='空機'||v==='停機')return;
      const cost2=toolCost(t);
      const ac=ac2[v]||0;
      const eff=(cost2>=1&&ac>=1)?Math.min(cost2,pl2[v]||0):cost2;
      pl2[v]=Math.max(0,(pl2[v]||0)-eff);
      tc2[v]++;
      if(toolIsAuto(t))ac2[v]++;
    });

    // 建立派工人員→站點 map（用於 site 限制）
    const dispSite2={};
    ['P2','P6','P8'].forEach(s2=>{
      const v=S.pendingDispatch?.[sfPfx2+s2+'_'+dateStr]??S.dispatchAssign[sfPfx2+s2+'_'+dateStr]??'';
      if(v&&v!=='空機') dispSite2[v]=s2;
    });

    // 收集空機台（按 P2/P8→P7→P6 順序）
    const emptyTools=S.tools.filter(t=>{
      if((t.status||'auto')==='off'||toolIsRemote(t))return false;
      if(S.machineOff[t.id+'_'+dateStr])return false;
      const mk=sfPfx2+t.id+'_'+dateStr;
      const cur=S.pendingAssign[mk]||S.toolAssign[mk]||'';
      return !cur||cur==='空機';
    }).sort((a,b)=>{
      const so={'P2':0,'P8':1,'P6':2,'P7':3};
      return (so[a.site]??9)-(so[b.site]??9);
    });
    if(!emptyTools.length)return;

    // ── 第一輪：未被分配的人（tc=0）優先填入，放寬2機上限 ──
    const unassigned=allPeople2.filter(m=>(tc2[m.name]||0)===0);
    emptyTools.forEach(tool=>{
      const mk=sfPfx2+tool.id+'_'+dateStr;
      if((S.pendingAssign[mk]||S.toolAssign[mk]||'')&&(S.pendingAssign[mk]||S.toolAssign[mk])!=='空機')return;
      const tsk=tool.skills||[]; const cost2=toolCost(tool);
      // 找：未分配的人，技能符合，人力足夠
      let cands=unassigned.filter(m=>{
        if(!tsk.some(sk=>(m.skills||[]).includes(sk)))return false;
        // 派工人員只能排同 site 機台
        if(dispSite2[m.name]&&dispSite2[m.name]!==tool.site) return false;
        const ac=ac2[m.name]||0;
        const eff=(cost2>=1&&ac>=1)?Math.min(cost2,pl2[m.name]||0):cost2;
        return (pl2[m.name]||0)>=eff;
      });
      // 同 site 優先
      cands.sort((a,b)=>(a.site===tool.site?0:1)-(b.site===tool.site?0:1));
      if(!cands.length)return;
      const picked=cands[0];
      S.pendingAssign[mk]=picked.name;
      const ac=ac2[picked.name]||0;
      const eff=(cost2>=1&&ac>=1)?Math.min(cost2,pl2[picked.name]||0):cost2;
      pl2[picked.name]=Math.max(0,(pl2[picked.name]||0)-eff);
      tc2[picked.name]++;
      if(toolIsAuto(tool))ac2[picked.name]++;
      // 從 unassigned 移除（已分配到至少一機）
      const idx=unassigned.indexOf(picked);
      if(idx>=0)unassigned.splice(idx,1);
    });

    // ── 第二輪：若還有空機，所有有剩餘人力的人都可再排（含已有機台者） ──
    emptyTools.forEach(tool=>{
      const mk=sfPfx2+tool.id+'_'+dateStr;
      if((S.pendingAssign[mk]||S.toolAssign[mk]||'')&&(S.pendingAssign[mk]||S.toolAssign[mk])!=='空機')return;
      const tsk=tool.skills||[]; const cost2=toolCost(tool);
      let cands=allPeople2.filter(m=>{
        if(!tsk.some(sk=>(m.skills||[]).includes(sk)))return false;
        // 派工人員只能排同 site 機台
        if(dispSite2[m.name]&&dispSite2[m.name]!==tool.site) return false;
        // 放寬2機上限，只要有剩餘人力
        const ac=ac2[m.name]||0;
        const eff=(cost2>=1&&ac>=1)?Math.min(cost2,pl2[m.name]||0):cost2;
        return (pl2[m.name]||0)>=eff;
      });
      cands.sort((a,b)=>{
        // 同 site 優先；未排者優先；派工人員最後；人力剩餘多優先
        const sa=a.site===tool.site?0:1, sb=b.site===tool.site?0:1;
        if(sa!==sb)return sa-sb;
        const ua=(tc2[a.name]||0)===0?0:1, ub=(tc2[b.name]||0)===0?0:1;
        if(ua!==ub)return ua-ub;
        const da=dispSite2[a.name]?1:0, db=dispSite2[b.name]?1:0;
        if(da!==db)return da-db;
        return (pl2[b.name]||0)-(pl2[a.name]||0);
      });
      if(!cands.length)return;
      const picked=cands[0];
      S.pendingAssign[mk]=picked.name;
      const ac=ac2[picked.name]||0;
      const eff=(cost2>=1&&ac>=1)?Math.min(cost2,pl2[picked.name]||0):cost2;
      pl2[picked.name]=Math.max(0,(pl2[picked.name]||0)-eff);
      tc2[picked.name]++;
      if(toolIsAuto(tool))ac2[picked.name]++;
    });
  });
  LS_save(); renderAdminTab();
  toast(`草稿：${cnt} 人員/${skip} 空機，確認後儲存`,'ok');
}

// 從工號表完整同步 → S.members（新增缺少的人員，更新現有人員的班別/Site）
async function gsImportEmpToMembers(){
  const el=document.getElementById('gs-sync-status');
  el.textContent='從工號表同步中...';
  try{
    const empList=await gsCall('getEmpIds');
    if(!empList||empList.length===0){el.textContent='⚠ 工號表無資料';return;}

    const existingByName=Object.fromEntries(S.members.map(m=>[m.name,m]));
    let maxId=Math.max(...S.members.map(m=>m.id||0),0);
    let added=0,updated=0;

    empList.forEach(emp=>{
      const name=emp.name;
      if(existingByName[name]){
        // 更新班別/Site/工號，保留技能
        const m=existingByName[name];
        m.shift=emp.shift; m.site=emp.site; m.empId=emp.empId;
        updated++;
      } else {
        // 新增（依 site 給預設技能）
        const siteSkills={'P2':['CS'],'P6':['nonCS'],'P7':['ARMauto'],'P8':['ARM']};
        S.members.push({id:++maxId,name,shift:emp.shift,site:emp.site,empId:emp.empId,skills:siteSkills[emp.site]||[],prefTool:[]});
        added++;
      }
    });

    LS_save();
    // 同步推送至雲端
    const chunks=[
      {stage:S.stage,schedMonth:S.schedMonth,members:S.members,tools:S.tools,machineOff:S.machineOff,snapshots:S.snapshots},
      {phase1:S.phase1,phase2:S.phase2,phase3:S.phase3,emergencyLeave:S.emergencyLeave,emgAssign:S.emgAssign,emgDispatch:S.emgDispatch},
      {p2WaveStatus:S.p2WaveStatus,p3Requests:S.p3Requests,p3WaveStatus:S.p3WaveStatus,p3FinalSubmitted:S.p3FinalSubmitted},
      {toolAssign:S.toolAssign,pendingAssign:S.pendingAssign,dispatchAssign:S.dispatchAssign,pendingDispatch:S.pendingDispatch}
    ];
    for(let i=0;i<chunks.length;i++) await gsCall('saveChunk',{chunkId:i,totalChunks:chunks.length,data:JSON.stringify(chunks[i])});

    el.textContent=`✅ 新增 ${added} 人，更新 ${updated} 人`;
    toast(`同步完成：新增 ${added} 人，更新 ${updated} 人`,'ok');
    renderAdminTab();
  }catch(e){el.textContent='❌ '+e.message;toast('同步失敗：'+e.message,'err');}
}

}

// ══════════════════════════════════════════
// 智慧輪詢：每30秒檢查 Stage 變化
// ══════════════════════════════════════════
let _pollTimer = null;
let _lastStage = null;

function startPolling() {
  if (!GS_MODE) return;
  // 管理員不需要輪詢（自己就是操作方）
  if (window.CU && window.CU.role === 'admin') return;
  stopPolling();
  _pollTimer = setInterval(async () => {
    const ov = document.getElementById('ov');
    if (ov && ov.classList.contains('show')) return;
    try {
      // 只讀 stage（輕量，不讀整個 state）
      const data = await gsCall('getStage', {});
      if (!data || data.stage === undefined) return;
      if (_lastStage === null) { _lastStage = data.stage; return; }
      if (data.stage !== _lastStage) {
        const msgs = {
          0: '系統暫時關閉',
          1: '📋 請假申請已開放，請填寫本月假別',
          2: '✅ 加班預排確認，請確認加班安排',
          3: '🔒 排班已完成，可查看本月人機表',
          4: '📣 本月人機表已公布，進入維護模式（機台安排可繼續修改）'
        };
        const newStage = data.stage;
        _lastStage = newStage;
        // 拉取完整 state 更新本地
        try {
          const fullData = await gsCall('loadChunks', {});
          if(fullData && Object.keys(fullData).length>0){
            S = {...defState(), ...fullData}; LS_save();
          }
        } catch(e2) { S.stage = newStage; LS_save(); }
        // 顯示通知
        OM('📢 排班系統更新通知',
          `<div style="padding:16px;text-align:center">
            <div style="font-size:32px;margin-bottom:12px">📢</div>
            <div style="font-size:15px;font-weight:600;margin-bottom:8px">管理員已更新排班設定</div>
            <div style="font-size:13px;color:#64748b;background:#f1f5f9;padding:10px;border-radius:8px">
              ${msgs[newStage]||'階段已更新為第'+newStage+'階段'}
            </div>
          </div>`,
          `<button class="btn btn-primary" onclick="CM();renderApp()">確認並更新畫面</button>`
        );
      }
    } catch(e) { console.log('輪詢失敗:', e.message); }
  }, 15000); // 15秒
}
function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

function toggleStage(n){
  if(n===4){ toast('請使用「公布人機表」按鈕進入維護模式','info'); return; }
  if(S.stage===n){
    S.stage=0;
    toast(`第${n}階段已關閉`,'info');
  } else {
    S.stage=n;
    if(n===2 && !S.p2WaveStatus) S.p2WaveStatus={wave:1,finalSubmitted:{},pendingRevise:{}};
    if(n===3){
      if(!S.p3FinalSubmitted) S.p3FinalSubmitted={};
      // 進入第三階段：未取消的第二階段預排加班全部升為正式加班（confirmed:true）
      let promoted=0;
      Object.keys(S.phase2).forEach(key=>{
        const v=S.phase2[key];
        if(v && v.confirmed===false){
          S.phase2[key]={...v, confirmed:true}; promoted++;
        }
      });
      if(promoted>0) toast(`進入第三階段：${promoted} 筆預排加班已升為正式加班`,'ok');
      else toast(`第${n}階段已開放`,'ok');
    } else {
      toast(`第${n}階段已開放`,'ok');
    }
  }
  LS_save();renderAdminTab();renderTopbar();
  // 立即把 stage 同步到雲端（JSONP GET，確保員工能讀到）
  if(GS_MODE){
    gsCall('saveStage',{stage:S.stage,empId:'admin'})
      .then(()=>{
        _lastStage=S.stage; // 同步基準，避免自己的變更觸發通知
        toast('階段已同步至雲端 ✅','ok');
      })
      .catch(e=>toast('雲端同步失敗：'+e.message,'warn'));
  }
}

function exportXLS(type){
  const {y,m}=S.schedMonth; const days=monthDays(y,m); const wb=XLSX.utils.book_new();
  if(type==='overview'){
    const hdr=['姓名','班別','技能',...days.map(d=>`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`)];
    const data=[hdr,...S.members.map(mem=>[mem.name,mem.shift,mem.skills.join(','),...days.map(d=>{const s=getStatus(mem.name,d);return TL[s.type]||s.type;})])];
    const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:10},{wch:6},{wch:12},...days.map(()=>({wch:7}))];
    XLSX.utils.book_append_sheet(wb,ws,'排班總覽');
  } else if(type==='phase3'){
    const hdr=['班別','機台ID','Site','機型',...days.map(d=>`${d.getMonth()+1}/${d.getDate()}`)];
    const data=[hdr,...SHIFTS.flatMap(sf2=>S.tools.map(t=>[sf2,t.id,t.site,toolModelLabel(t.model||''),...days.map(d=>{const mk=taKey(sf2,t.id,dk(d));return S.machineOff[t.id+'_'+dk(d)]?'停機':(S.toolAssign[mk]||'—');})]))]; 
    const ws=XLSX.utils.aoa_to_sheet(data); XLSX.utils.book_append_sheet(wb,ws,'機台分配');
  } else {
    const data=[['姓名','班別','技能'],...S.members.map(m=>[m.name,m.shift,m.skills.join(',')])];
    const ws=XLSX.utils.aoa_to_sheet(data); XLSX.utils.book_append_sheet(wb,ws,'人員清單');
  }
  XLSX.writeFile(wb,`TEM_${type}_${y}${String(m+1).padStart(2,'0')}.xlsx`);
  toast('已匯出','ok');
}

function importXLS(evt){
  const file=evt.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1});
      if(data.length<2){toast('資料不足','err');return;}
      const hdr=data[0]; const dateStart=3;
      const {y,m}=S.schedMonth;
      data.slice(1).forEach(row=>{
        const name=String(row[0]||'').trim();
        const mem=S.members.find(x=>x.name===name); if(!mem)return;
        hdr.slice(dateStart).forEach((h,i)=>{
          const val=String(row[dateStart+i]||'').trim();
          if(!val||val==='上班')return;
          const md=String(h).replace(/[()]/g,'');
          const parts=md.split('/');
          if(parts.length<2)return;
          const ds=`${y}-${String(parseInt(parts[0])).padStart(2,'0')}-${String(parseInt(parts[1])).padStart(2,'0')}`;
          const key=name+'_'+ds;
          const tm={'預排休假-特休':'annual','預排休假-補休':'comp','預排休假-病假':'sick','預排休假-生理假':'physio','預排休假-產假':'maternity','預排休假-家庭照顧假':'family','預排休假-幼兒照顧假':'infant','預排休假-喪假':'funeral','預排休假-事假':'personal','預排休假-國假':'hol_leave','加班費':'ot','特休':'annual','病假':'sick','事假':'personal','補休':'comp','加班':'ot','休假':'off'};
          const t=tm[val];
          if(t){
            if(['annual','sick','personal','comp','off'].includes(t)) S.phase1[key]={type:t,note:'(匯入)'};
            else if(t==='ot') S.phase2[key]={type:'ot',note:'(匯入)'};
          }
        });
      });
      LS_save();renderAdminTab();toast('匯入完成','ok');
    }catch(err){toast('匯入失敗: '+err.message,'err');}
  };
  reader.readAsBinaryString(file); evt.target.value='';
}

function renderUserCal(){
  const {y,m}=userMonthState;
  document.getElementById('umolbl').textContent=`${y}年${m+1}月`;
  const el2=document.getElementById('umolbl2'); if(el2) el2.textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay();
  const days=monthDays(y,m);
  const today=new Date(); today.setHours(0,0,0,0);
  const stage=S.stage;

  // 缺額計算（stage 2/3 共用）
  const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');
  const maxOT=allActive.length-allActive.filter(t=>toolIsAuto(t)).length;
  const leaveTypesRest=['annual','sick','physio','maternity','family','infant','funeral','personal','hol_leave','comp'];
  const sfPair=pairShiftOf(CU.shift);

  // 計算某天缺額（CU 是休假日，對班上班日）
  function calcDeficit(d, dateStr){
    // CU 休假日 = 對班可能需要加班的日
    if(shiftWork(d,sfPair)!=='work') return 0; // 對班也在休假，無需要
    const pairOnDuty=S.members.filter(mem=>{
      if(mem.shift!==sfPair) return false;
      const ms=getStatus(mem.name,d);
      return ms.base==='work'&&!leaveTypesRest.includes(ms.type);
    }).length;
    const myShiftOT=S.members.filter(mem=>{
      if(mem.shift!==CU.shift) return false;
      return !!S.phase2[mem.name+'_'+dateStr];
    }).length;
    const p3ShiftOT=S.members.filter(mem=>{
      if(mem.shift!==CU.shift) return false;
      return !!S.p3Requests[mem.name+'_'+dateStr];
    }).length;
    return Math.max(0, maxOT-pairOnDuty-myShiftOT-p3ShiftOT);
  }

  let html='';
  for(let i=0;i<first;i++) html+='<div class="cal-day empty"></div>';

  days.forEach(d=>{
    const dateStr=dk(d);
    const s=getStatus(CU.name,d);
    const base=s.base;
    const isToday=d.getTime()===today.getTime();
    const key=CU.name+'_'+dateStr;
    const p1=S.phase1[key];
    const p2=S.phase2[key];
    const noOt=!!(p1?.noOt);
    const hasP3Req=!!S.p3Requests[key];
    const isOtDay=!!p2||hasP3Req; // 休假日被排加班（顯示如上班日）

    let statusLabel='', statusCls='cds-off', clickable=false, deficitBadge='';

    if(base==='off'){
      if(noOt){
        // 不接受加班標記：stage1 可點（讓人員取消），其他階段不可點
        statusLabel='X'; statusCls='cds-decline';
        clickable=(stage===1); // stage1 可點取消標記
      } else if(stage===1){
        statusLabel='休'; statusCls='cds-off'; clickable=true;
      } else if(stage===2){
        const deficit=calcDeficit(d,dateStr);
        if(p2){
          const _conf=p2?.confirmed;
          if(_conf===true || p2===true){
            // 已確認加班：不可點
            statusLabel='加班'; statusCls='cds-ot'; clickable=false;
          } else {
            // 草稿/未確認（confirmed=false）：P加班，可點確認/取消
            statusLabel='P加班'; statusCls='cds-preot'; clickable=true;
          }
        } else {
          statusLabel='休'; statusCls='cds-off';
          clickable=shiftWork(d,sfPair)==='work'&&deficit>0;
        }
        if(shiftWork(d,sfPair)==='work'&&deficit>0){
          deficitBadge=`<div style="font-size:8px;color:#dc2626;font-weight:700;line-height:1">-${deficit}</div>`;
        }
      } else if(stage===3){
        // stage3 顯示規則：
        // - p2 confirmed=true（第二階段已確認加班）→ 加班，不可點
        // - p2 confirmed=false（草稿）或 p3Req → 預排，可點取消
        // - 純休假/上班日 → 不可點
        // stage3 顯示：p2 全部已是 confirmed:true（進入stage3時自動升級）
        // p2 confirmed → 正式加班（不可點）
        // p3Req → P加班（可取消）
        // p3Draft → P加班（preot 樣式，可取消）
        const _p2conf=(p2?.confirmed===true)||(p2===true);
        if(_p2conf){
          statusLabel='加班'; statusCls='cds-ot'; clickable=false; // 正式加班不可改
        } else if(hasP3Req){
          statusLabel='加班'; statusCls='cds-ot'; clickable=true; // P加班已確認，可取消
        } else if(S.p3WaveStatus?.draft?.[key]){
          statusLabel='P加班'; statusCls='cds-preot'; clickable=true; // 預排P加班可取消
        } else {
          // 純休假：缺額 > 3 才可點
          const _def3=calcDeficit(d,dateStr);
          statusLabel='休'; statusCls='cds-off';
          clickable=_def3>3;
          if(_def3>3) deficitBadge=`<div style="font-size:8px;color:#dc2626;font-weight:700;line-height:1">-${_def3}</div>`;
        }
      } else if(stage===4||S.published){
        // 公佈後行事曆不顯示機台，改在「機台安排」分頁顯示
        statusLabel=p2||hasP3Req?'加班':'休';
        statusCls=p2||hasP3Req?'cds-ot':'cds-off';
      } else if(stage===3){
        // stage3：休假日有加班申請也顯示橘色
        if(hasP3Req){ statusLabel='申請'; statusCls='cds-ot'; clickable=true; }
        else if(p2){ statusLabel='加班'; statusCls='cds-ot'; }
        else { statusLabel='休'; statusCls='cds-off'; }
      } else {
        statusLabel=isOtDay?'加班':'休'; statusCls=isOtDay?'cds-ot':'cds-off';
      }
    } else {
      // 上班日
      const t=s.type;
      statusLabel=TL[t]||t; statusCls=calCls(t);
      if(stage===1||stage===2) clickable=true; // stage2 上班日也可修改假別
      // stage3 上班日不可修改（鎖定）
    }

    const isHol=isHoliday(dateStr);
    const isMkup=isMakeupHoliday(dateStr);
    html+=`<div class="cal-day${base==='off'?' is-off':''}${isToday?' is-today':''}${isHol?' is-holiday':isMkup?' is-makeup':''}" ${clickable?`onclick="openUserDay('${dateStr}')"`:''} style="${clickable?'cursor:pointer':''}">
      <div class="cdn">${d.getDate()}${isHol?'<span class="hol-badge"> 假</span>':isMkup?'<span class="hol-badge" style="background:#e0f2fe;color:#0369a1"> 補</span>':''}</div>
      ${deficitBadge}
      <div class="cds ${statusCls}">${statusLabel}</div>
    </div>`;
  });
  document.getElementById('userCal').innerHTML=html;

  // 底部行動區塊
  const hasFinalSubmit=!!(S.p2WaveStatus?.finalSubmitted?.[CU.name]);
  const hasP3Submit=!!(S.p3FinalSubmitted?.[CU.name]);
  let actionHtml='';

  if(stage===2){
    const myOtDays=Object.keys(S.phase2).filter(k=>k.startsWith(CU.name+'_')).length;
    if(hasFinalSubmit){
      actionHtml=`<div style="margin:8px 12px;padding:10px;background:#f0fdf4;border:1px solid #16a34a;border-radius:8px;text-align:center;font-size:12px;color:#15803d">
        ✅ 已送出第二階段確認（共${myOtDays}天加班）<br><span style="font-size:10px;color:#888">本輪不可再修改</span>
      </div>`;
    } else {
      actionHtml=`<div style="margin:8px 12px;padding:10px;background:#fef9c3;border:1px solid #ca8a04;border-radius:8px">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px">已選 ${myOtDays}/6 天加班</div>
        <div style="font-size:11px;color:#555;margin-bottom:8px">點選有缺額（-N）的日期可加班，確認後送出</div>
        <button class="btn btn-primary" style="width:100%" onclick="submitP2Final()">✅ 送出第二階段確認</button>
      </div>`;
    }
  } else if(stage===3){
    const myP3Days=Object.keys(S.p3Requests||{}).filter(k=>k.startsWith(CU.name+'_')).length;
    if(hasP3Submit){
      actionHtml=`<div style="margin:8px 12px;padding:10px;background:#f0fdf4;border:1px solid #16a34a;border-radius:8px;text-align:center;font-size:12px;color:#15803d">
        ✅ 已送出第三階段確認（${myP3Days}筆申請）
      </div>`;
    } else {
      const DOW3=['日','一','二','三','四','五','六'];
      const mkDay=ds=>{const d=pd(ds);return `<div style="font-size:11px;color:#555;padding:2px 0">${ds}（${DOW3[d.getDay()]}）</div>`;};

      // 第三階段新預排的日子（p3Requests + draft，排除已是 p2 confirmed 的日期）
      const p2ConfSet=new Set(Object.keys(S.phase2).filter(k=>{
        if(!k.startsWith(CU.name+'_')) return false;
        const v=S.phase2[k]; return v?.confirmed===true||v===true;
      }).map(k=>k.slice(CU.name.length+1)));
      const p3NewDays=Object.keys(S.p3Requests||{}).filter(k=>k.startsWith(CU.name+'_'))
        .map(k=>k.slice(CU.name.length+1)).filter(ds=>!p2ConfSet.has(ds)).sort();
      const p3DraftDays=Object.keys(S.p3WaveStatus?.draft||{}).filter(k=>k.startsWith(CU.name+'_'))
        .map(k=>k.slice(CU.name.length+1)).filter(ds=>!p2ConfSet.has(ds)&&!p3NewDays.includes(ds)).sort();
      const p3ShowDays=[...p3NewDays].sort(); // 只顯示已申請的 P加班（不含草稿）

      // 送出確認顯示：p2 confirmed + p3 全部加班
      const allOtDays=[...p2ConfSet,...p3NewDays].sort();

      const draftNotice=p3DraftDays.length>0?`<div style="background:#fef9c3;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:11px">
        📋 P加班預排草稿 ${p3DraftDays.length} 天（橘色格，未確認）</div>`:'';
      // 下方提示：只顯示第三階段新預排的日子
      const p3ListHtml=p3ShowDays.length>0
        ?`<div style="font-size:11px;font-weight:600;color:#1d4ed8;margin-bottom:3px">P加班（${p3ShowDays.length}天）：</div>
          <div style="max-height:80px;overflow-y:auto;margin-bottom:6px">${p3ShowDays.map(mkDay).join('')}</div>`
        :`<div style="font-size:11px;color:#888;margin-bottom:6px">尚無第三階段新預排</div>`;
      actionHtml=`<div style="margin:8px 12px;padding:10px;background:#eff6ff;border:1px solid #3b82f6;border-radius:8px">
        ${draftNotice}
        ${p3ListHtml}
        <button class="btn btn-primary" style="width:100%" onclick="submitP3Final()">送出確認（加班 ${allOtDays.length} 天）</button>
      </div>`;
    }
  }
  // stage4/published 不在行事曆底部顯示機台安排，改在「機台安排」分頁顯示
  const actionEl=document.getElementById('userCalAction');
  if(actionEl) actionEl.innerHTML=actionHtml;
}

function userMoNav(n){
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  let prevY = curY, prevM = curM - 1;
  if(prevM < 0) { prevM = 11; prevY--; }
  let nextY = curY, nextM = curM + 1;
  if(nextM > 11) { nextM = 0; nextY++; }

  let ny = userMonthState.y, nm = userMonthState.m + n;
  if(nm > 11) { nm = 0; ny++; }
  if(nm < 0)  { nm = 11; ny--; }

  const tooOld = ny < prevY || (ny === prevY && nm < prevM);
  const tooNew = ny > nextY || (ny === nextY && nm > nextM);
  if(tooOld || tooNew) { toast('只能查看前後各一個月','info'); return; }

  userMonthState.y = ny; userMonthState.m = nm;
  renderUserView(); // 重新渲染整個使用者視圖
  const days = monthDays(ny, nm);
  let workC=0,leaveC=0,otC=0;
  days.forEach(d=>{const s=getStatus(CU.name,d);const t=s.type;if(t==='work'||t==='comp')workC++;else if(['annual','sick','physio','maternity','family','infant','funeral','personal','hol_leave'].includes(t))leaveC++;else if(t==='ot')otC++;}); 
  const stats=document.querySelectorAll('.hstat-n');
  if(stats[0])stats[0].textContent=workC;
  if(stats[1])stats[1].textContent=leaveC;
  if(stats[2])stats[2].textContent=otC;
}

      ).join('');

      OM(`📝 ${dateStr}（${dow}）`,`
        ${holInfo}

    }

  // ── Stage 2：選加班日 / 取消加班 ──
  } else if(stage===2){
    if(s.base==='off'&&!noOt){
      const hasOt=!!p2;
      // legacy: p2===true 是舊格式已確認加班
      const isConfirmed=(p2?.confirmed===true)||(p2===true); // 已確認
      const isDraft=p2?.confirmed===false; // 草稿待確認（管理員預排未人員確認）
      const hasFinalSubmit=!!(S.p2WaveStatus?.finalSubmitted?.[CU.name]);
      const myOtDays=Object.keys(S.phase2).filter(k=>k.startsWith(CU.name+'_')).length;
      const canAdd=!hasOt&&myOtDays<6&&!hasFinalSubmit;
      if(isConfirmed){
        // 已確認加班：不可取消，直接關閉
        OM(`📋 ${dateStr}（${dow}）`,`
          <div class="minfo" style="color:#15803d">✅ 加班已確認，不可取消</div>`,
          `<button class="btn btn-ghost" onclick="CM()">關閉</button>`);
        return;
      }
      if(hasFinalSubmit&&!isDraft){
        // 已送出確認且不是草稿：唯讀
        OM(`📋 ${dateStr}（${dow}）`,`
          <div class="minfo" style="color:#15803d">

          `<button class="btn btn-ghost" onclick="CM()">關閉</button>`);

        <div class="minfo">目前狀態：${hasOt?'✅ 已選加班':'休假日'} ｜ 本月已選：${myOtDays}/6 天</div>
         <div class="ogrid" id="lvOpts">
           ${isDraft?`
             <div style="background:#fef9c3;border-radius:6px;padding:8px;margin-bottom:6px;font-size:11px;grid-column:1/-1">📋 管理員預排草稿，請確認是否加班</div>
             <div class="obtn s-annual" onclick="pickLeave('__confirmOt__',this)">✅ 確認加班</div>
             <div class="obtn" onclick="cancelOtWish()">✕ 取消（不加班）</div>

    } else if(s.base==='work'){

      if(hasFinalSubmit2){
        OM(`📋 ${dateStr}（${dow}）`,`<div class="minfo" style="color:#15803d">✅ 已送出第二階段確認，不可修改</div>`,

      const cur=p1;

      const leaveOptsS2=[
        {k:'annual',l:'特休'},{k:'comp',l:hol?'報-補休':'補休'},
        {k:'sick',l:'病假'},{k:'physio',l:'生理假'},
        {k:'maternity',l:'產假'},{k:'family',l:'家庭照顧假'},
        {k:'infant',l:'幼兒照顧假'},{k:'funeral',l:'喪假'},

      if(hasAnyOt){

        const _p2conf=(hasPh2&&(p2?.confirmed===true||p2===true));
        const _p2draft=hasPh2&&p2?.confirmed===false;
        if(_p2conf&&!hasReq){
          // 第二階段已確認加班：不可取消
          OM(`📋 ${dateStr}（${dow}）加班`,`

        }

function applyP3OtAtomic(dateStr){
  // 原子操作：先重算缺額確認仍有空位，再寫入 p3Requests
  if(S.p3FinalSubmitted?.[CU.name]){toast('已送出確認，不可修改','err');return;}
  const d=pd(dateStr);
  const key=CU.name+'_'+dateStr;
  if(S.p3Requests[key]||S.phase2[key]){toast('此日已有加班記錄','err');CM();return;}
  // 重算即時缺額
  const allAct=S.tools.filter(t=>(t.status||'auto')!=='off');
  const maxOT=allAct.length-allAct.filter(t=>toolIsAuto(t)).length;
  const pairSf=pairShiftOf(CU.shift);
  if(shiftWork(d,pairSf)!=='work'){toast('對班當天非上班日','err');CM();return;}
  const ltR=['annual','sick','physio','maternity','family','infant','funeral','personal','hol_leave','comp'];
  const pairOnDuty=S.members.filter(m=>{
    if(m.shift!==pairSf)return false;
    const ms=getStatus(m.name,d);
    return ms.base==='work'&&!ltR.includes(ms.type);
  }).length;
  const dispCount=S.members.filter(m=>{
    if(m.shift!==pairSf)return false;
    return (m.skills||[]).includes('派工')||(m.skills||[]).includes('代理');
  }).length;
  const alreadyOT=S.members.filter(m=>{
    if(m.shift!==CU.shift)return false;
    return !!(S.phase2[m.name+'_'+dateStr]||S.p3Requests[m.name+'_'+dateStr]);
  }).length;
  const deficit=Math.max(0,maxOT-(pairOnDuty-dispCount)-alreadyOT);
  if(deficit<=0){toast('缺額已滿，無法加入','err');CM();renderUserCal();return;}
  // 寫入
  if(wouldCause7Consec(CU.name,d)){toast('⚠ 此日加班後將連續7天以上上班','err');return;}
  S.p3Requests[key]=true;
  addNotif('p3_apply',`${CU.name} 申請 ${dateStr} 第三階段加班`);
  LS_save();CM();renderUserCal();toast('已申請加班','ok');
}

  LS_save(); CM(); renderAdminTab();
  // 雲端同步新月份
  if(GS_MODE){
    gsCall('saveStage',{stage:0,empId:'admin'})
      .then(()=>{ _lastStage=0; })
      .catch(()=>{});
    // 推送新 state
    setTimeout(()=>{
      gsPushState().catch(()=>{});
    }, 500);
  }
  toast(`已切換到 ${ny}年${nm+1}月，Stage 重設為 0`,'ok');
}

function _doPublishAssign(){
  S.published=true;
  S.stage=4; // 公布後進入 stage 4（維護模式）
  addNotif('publish',`管理員已公布${S.schedMonth.y}年${S.schedMonth.m+1}月人機表，請查看行事曆`);
  LS_save();CM();renderAdminTab();toast('人機表已公布，人員可查看','ok');
  // 同步到雲端
  if(GS_MODE){
    gsCall('saveStage',{stage:4,empId:'admin'})
      .then(()=>{ _lastStage=4; toast('公布已同步至雲端 ✅','ok'); })
      .catch(e=>toast('雲端同步失敗：'+e.message,'warn'));
  }
}
// ── 通知系統 ──
function addNotif(type, msg){
  if(!S.notifications) S.notifications=[];
  const id=Date.now()+'_'+Math.random().toString(36).slice(2,6);
  S.notifications.unshift({id, ts:new Date().toISOString(), from:CU?.name||'?', type, msg, read:false});
  if(S.notifications.length>200) S.notifications=S.notifications.slice(0,200);
  // 更新管理員通知徽章
  updateNotifBadge();
}
function updateNotifBadge(){
  const unread=(S.notifications||[]).filter(n=>!n.read).length;
  const badge=document.getElementById('notifBadge');
  if(badge){ badge.textContent=unread>0?unread:''; badge.style.display=unread>0?'':'none'; }
}
function renderNotifPanel(mc){
  const notifs=S.notifications||[];
  // 標記全部已讀
  notifs.forEach(n=>n.read=true);
  LS_save(); updateNotifBadge();
  const TYPE_LABEL={'leave':'假別','no_ot':'不加班','ot_wish':'加班意願','p3_req':'第三階段申請'};
  mc.innerHTML=`<div style="flex:1;overflow-y:auto;padding:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">📬 人員送出紀錄（${notifs.length} 筆）
      <button class="btn btn-ghost btn-xs" style="margin-left:8px" onclick="S.notifications=[];LS_save();renderAdminTab()">清除全部</button>
    </div>
    ${notifs.length===0?'<div style="color:#888;text-align:center;padding:24px">暫無通知</div>':
    notifs.map(n=>{
      const dt=new Date(n.ts);
      const dtStr=`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `<div style="border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;margin-bottom:6px;background:#f9fafb">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;font-weight:600;color:#1e40af">${n.from}</span>
          <span style="font-size:10px;color:#888">${dtStr}</span>
        </div>
        <div style="font-size:11px;color:#374151;margin-top:2px">${n.msg}</div>
        <span style="font-size:9px;background:#e0f2fe;color:#0369a1;border-radius:3px;padding:1px 5px">${TYPE_LABEL[n.type]||n.type}</span>
      </div>`;
    }).join('')}
  </div>`;
}
// ═══════════════════════════════════════════════════════════════
//  MODAL HELPERS
// ═══════════════════════════════════════════════════════════════
function OM(title,body,foot=''){
  document.getElementById('mtitle').innerHTML=title;
  document.getElementById('mbody').innerHTML=body;
  document.getElementById('mfoot').innerHTML=foot||'<button class="btn btn-ghost" onclick="CM()">關閉</button>';
  document.getElementById('ov').classList.add('show');
}
function CM(){ document.getElementById('ov').classList.remove('show'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target===document.getElementById('ov'))CM(); });

// ═══════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════
function toast(msg,type='info'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast show ${type==='ok'?'ok':type==='err'?'err':'info'}`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3000);
}

//  INIT
// ═══════════════════════════════════════════════════════════════
LS_load();
// 初始月份永遠以當前月份為基準，不使用儲存值
const _now = new Date();
S.schedMonth = { y: _now.getFullYear(), m: _now.getMonth() };
userMonthState = { y: _now.getFullYear(), m: _now.getMonth() };
