<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEM 四班二輪排班系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

/* ════════════════════════════════════════════
ROOT VARIABLES — 仿實體班表色系
════════════════════════════════════════════ */
:root {
  /* 表格色彩 */
  --c-auto:    #c6efce; --c-auto-t:    #276221;
  --c-t5:      #ffeb9c; --c-t5-t:      #9c6500;
  --c-empty:   #ffb27a; --c-empty-t:   #7a2e00;
  --c-cryo:    #9dc3e6; --c-cryo-t:    #1a3a5c;
  --c-off:     #f2f2f2; --c-off-t:     #888;
  --c-person:  #ffffff; --c-person-t:  #1a1a1a;
  --c-machoff: #ffc7ce; --c-machoff-t: #9c0006;
  --c-leave:   #fff2cc; --c-leave-t:   #7f6000;
  --c-ot:      #e2efda; --c-ot-t:      #375623;
  --c-preot:   #dce6f1; --c-preot-t:   #17375e;

  /* 欄位底色 */
  --h-NA: #d6e4f0; --h-NB: #d5e8d4; --h-DA: #ffe6cc; --h-DB: #ead1dc;

  /* UI */
  --bg: #f0f2f5;
  --surface: #fff;
  --border: #c9cdd4;
  --border-dark: #9aa0ac;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #999;
  --radius: 6px;
  --sh: 0 2px 8px rgba(0,0,0,.12);
  --sh-lg: 0 8px 32px rgba(0,0,0,.18);
}

/* ════ RESET ════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100%; font-size: 13px;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ════ LOGIN ════ */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #1a2744 0%, #2c4a7c 60%, #1a3560 100%);
  padding: 16px; position: relative; overflow: hidden;
}
#loginScreen::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 39px, rgba(255,255,255,.03) 39px, rgba(255,255,255,.03) 40px
  ), repeating-linear-gradient(
    90deg, transparent, transparent 39px, rgba(255,255,255,.03) 39px, rgba(255,255,255,.03) 40px
  );
}
.lcard {
  background: rgba(255,255,255,.08); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.15); border-radius: 16px;
  padding: 36px 32px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); position: relative; z-index: 1;
}
.llogo { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,.5); text-transform: uppercase; margin-bottom: 6px; }
.ltitle { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.lsub { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 32px; }
.lfield { margin-bottom: 14px; }
.lfield label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.45); text-transform: uppercase; margin-bottom: 6px; }
.lfield input {
  width: 100%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  color: #fff; padding: 11px 14px; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s;
}
.lfield input::placeholder { color: rgba(255,255,255,.3); }
.lfield input:focus { border-color: #60a5fa; background: rgba(255,255,255,.15); }
.lbtn {
  width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px;
  color: #fff; font-size: 14px; font-weight: 700; margin-top: 6px;
  transition: all .2s; letter-spacing: .5px;
}
.lbtn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,.4); }
.lerr {
  background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4);
  color: #fca5a5; padding: 9px 12px; border-radius: 7px; font-size: 12px; margin-bottom: 12px; display: none;
}
.lhint { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,.22); text-align: center; line-height: 1.9; border-top: 1px solid rgba(255,255,255,.1); padding-top: 16px; }
.lhint b { color: rgba(255,255,255,.4); }

/* ════ APP SHELL ════ */
#appShell { display: none; flex-direction: column; height: 100vh; }

/* ── TOPBAR ── */
.topbar {
  background: #1e3a6e; color: #fff; padding: 0 14px; height: 48px;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 300; position: relative;
}
.topbar-title { font-size: 15px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.topbar-title span { color: #60a5fa; }
.topbar-stage { display: flex; gap: 2px; background: rgba(255,255,255,.1); border-radius: 20px; padding: 3px; overflow-x: auto; flex-shrink: 0; }
.topbar-stage::-webkit-scrollbar { display: none; }
.stage-pill { padding: 3px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5); white-space: nowrap; cursor: default; }
.stage-pill.active { background: #2563eb; color: #fff; }
.stage-pill.done { color: #86efac; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ubadge { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; background: rgba(255,255,255,.12); border-radius: 24px; border: 1px solid rgba(255,255,255,.2); }
.uav { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; }
.av-admin { background: #dc2626; } .av-NA { background: #1d6fa4; } .av-NB { background: #0e8a5a; }
.av-DA { background: #b45309; } .av-DB { background: #7c3aed; }
.uname { font-size: 12px; font-weight: 600; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.urole { font-size: 10px; padding: 1px 7px; border-radius: 8px; font-weight: 700; }
.r-admin{background:#fef2f2;color:#ef4444} .r-NA{background:#dbeafe;color:#1d4ed8}
.r-NB{background:#dcfce7;color:#15803d} .r-DA{background:#ffedd5;color:#c2410c}
.r-DB{background:#ede9fe;color:#7c3aed}
.tbtn { padding: 5px 11px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.8); border-radius: 6px; font-size: 12px; transition: all .15s; white-space: nowrap; }
.tbtn:hover { background: rgba(255,255,255,.2); }

/* ── SUB NAV ── */
.subnav { background: #fff; border-bottom: 2px solid #e5e7eb; padding: 0 12px; display: flex; gap: 0; overflow-x: auto; flex-shrink: 0; }
.subnav::-webkit-scrollbar { display: none; }
.snav-btn { padding: 10px 16px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all .15s; cursor: pointer; }
.snav-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
.snav-btn:hover:not(.active) { color: var(--text); background: #f9fafb; }

/* ── MAIN CONTENT ── */
#mainContent { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ════ SPREADSHEET TABLE ════ */
.sheet-toolbar { background: #fff; border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.sheet-wrap { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }

table.sheet { border-collapse: collapse; font-size: 11.5px; white-space: nowrap; table-layout: fixed; min-width: max-content; }
table.sheet th, table.sheet td { border: 1px solid #b0b8c4; vertical-align: middle; text-align: center; height: 26px; padding: 1px 3px; overflow: hidden; text-overflow: ellipsis; }
table.sheet thead th { background: #eff6ff; font-weight: 700; font-size: 11px; position: sticky; top: 0; z-index: 30; user-select: none; }
table.sheet thead tr:first-child th { background: #dbeafe; color: #1e3a6e; font-size: 12px; }

table.sheet .col-no    { position: sticky; left: 0;    z-index: 20; width: 28px;  min-width: 28px;  background: #eff6ff; font-weight: 700; }
table.sheet .col-id    { position: sticky; left: 28px; z-index: 20; width: 80px;  min-width: 80px;  max-width: 80px; overflow:hidden; background: #eff6ff; text-align: left; padding-left: 4px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
table.sheet .col-site  { width: 36px;  min-width: 36px;  background: #eff6ff; font-size: 10px; }
table.sheet .col-loc   { width: 58px;  min-width: 58px;  background: #eff6ff; font-size: 10px; }
table.sheet thead .col-no, table.sheet thead .col-id { z-index: 40; }

table.sheet tbody td.col-no   { background: #f0f4ff; color: #6b7eb8; font-weight: 600; font-size: 10px; }
table.sheet tbody td.col-id   { background: #f8faff; text-align: left; padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.sheet tbody td.col-site { background: #f8faff; font-size: 10px; }
table.sheet tbody td.col-loc  { background: #f8faff; font-size: 10px; }
table.sheet tbody tr:hover td.col-no,
table.sheet tbody tr:hover td.col-no,
table.sheet tbody tr:hover td.col-id { background: #dbeafe; }
table.sheet tbody tr:hover td:not(.col-no):not(.col-id) { filter: brightness(.94); }

.dh-NA { background: var(--h-NA) !important; } .dh-NB { background: var(--h-NB) !important; }
.dh-DA { background: var(--h-DA) !important; } .dh-DB { background: var(--h-DB) !important; }
.dh-date { font-size: 11px; font-weight: 700; }
.dh-dow  { font-size: 9px; color: #555; }
.dh-weekend { color: #c00 !important; }
.dh-holiday { background: #fff8e1 !important; outline: 1px solid #ffd54f; }
.dh-makeup  { background: #e0f2fe !important; outline: 1px solid #7dd3fc; }
.is-makeup  { border-color: #7dd3fc; }

.dc { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: 500; }
.dc:hover { outline: 2px solid #2563eb; outline-offset: -1px; z-index: 2; position: relative; }

.dc-auto    { background: var(--c-auto);    color: var(--c-auto-t); }
.dc-t5      { background: var(--c-t5);      color: var(--c-t5-t); }
.dc-empty   { background: var(--c-empty);   color: var(--c-empty-t); }
.dc-cryo    { background: var(--c-cryo);    color: var(--c-cryo-t); }
.dc-off     { background: var(--c-off);     color: var(--c-off-t); }
.dc-machoff { background: var(--c-machoff); color: var(--c-machoff-t); }
.dc-person  { background: var(--c-person);  color: var(--c-person-t); }
.dc-leave   { background: var(--c-leave);   color: var(--c-leave-t); }
.dc-ot      { background: var(--c-ot);      color: var(--c-ot-t); }
.dc-preot   { background: var(--c-preot);   color: var(--c-preot-t); }

.dc-pend::after { content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; background: #ef4444; border-radius: 50%; }

table.sheet tfoot td { background: #f0fdf4; font-weight: 700; font-size: 11px; border-top: 2px solid #86efac; position: sticky; bottom: 0; z-index: 20; }
table.sheet tfoot .col-no, table.sheet tfoot .col-id { background: #d1fae5; z-index: 25; }
.stat-ok     { color: #276221; }
.stat-warn   { color: #9c6500; background: #ffeb9c !important; }
.stat-danger { color: #9c0006; background: #ffc7ce !important; }

/* ════ USER CALENDAR ════ */
.user-wrap { flex: 1; overflow-y: auto; padding: 12px; }
.user-hero { background: linear-gradient(135deg, #1e3a6e, #2563eb); color: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.hero-name { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
.hero-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.hero-chip { padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.15); }
.hero-stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.hstat { text-align: center; padding: 10px 14px; background: rgba(255,255,255,.1); border-radius: 8px; min-width: 66px; }
.hstat-n { font-size: 20px; font-weight: 700; }
.hstat-l { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 1px; }

.stage-notice { border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid #bfdbfe; background: #eff6ff; }
.sn-icon { font-size: 22px; flex-shrink: 0; }
.sn-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.sn-desc { font-size: 12px; color: #555; }

.month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.mnav-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.mnav-btn:hover { background: #f0f4ff; }
.mnav-label { font-size: 16px; font-weight: 700; min-width: 100px; text-align: center; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-size: 10px; font-weight: 700; padding: 5px 2px; color: #888; letter-spacing: .5px; }
.cal-dow.we { color: #ef4444; }
.cal-day { border: 1.5px solid #e5e7eb; border-radius: 8px; padding: 6px 4px; min-height: 70px; cursor: pointer; transition: all .15s; position: relative; background: #fff; display: flex; flex-direction: column; gap: 2px; }
.cal-day:hover { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
.cal-day.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
.cal-day.is-today { border-color: #2563eb; }
.cal-day.is-today .cdn { color: #2563eb; font-weight: 800; }
.cal-day.is-off { opacity: .75; }
.cdn { font-size: 11px; font-weight: 700; }
.cds { font-size: 10px; font-weight: 600; padding: 2px 4px; border-radius: 4px; display: inline-block; line-height: 1.4; }
.cds-work    { background: var(--c-auto);   color: var(--c-auto-t); }
.cds-off     { background: var(--c-off);    color: var(--c-off-t); border: 1px solid #ddd; }
.cds-annual  { background: var(--c-leave);  color: var(--c-leave-t); }
.cds-sick    { background: var(--c-machoff);color: var(--c-machoff-t); }
.cds-personal{ background: var(--c-cryo);  color: var(--c-cryo-t); }
.cds-comp    { background: #e8d5f5; color: #5b21b6; }
.cds-ot      { background: var(--c-ot);    color: var(--c-ot-t); }
.cds-preot   { background: var(--c-preot); color: var(--c-preot-t); }
.cds-confirm { background: #dcfce7; color: #15803d; }
.cds-decline { background: #fee2e2; color: #b91c1c; }
.cal-pend { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; background: #ef4444; border-radius: 50%; }
.cal-tool { font-size: 9px; color: #0369a1; line-height: 1.3; margin-top: 1px; }

/* ════ BUTTONS ════ */
.btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover { background: #1d4ed8; }
.btn-success { background: #16a34a; color: #fff; } .btn-success:hover { background: #15803d; }
.btn-warn { background: #d97706; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-ghost { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; } .btn-ghost:hover { background: #e5e7eb; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-xs { padding: 2px 7px; font-size: 10px; }

/* ════ MODAL ════ */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 12px; opacity: 0; pointer-events: none; transition: opacity .18s; }
.overlay.show { opacity: 1; pointer-events: all; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: var(--sh-lg); transform: scale(.96) translateY(8px); transition: transform .18s; }
.overlay.show .modal { transform: scale(1) translateY(0); }
.mhead { padding: 14px 18px 10px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 2; }
.mtitle { font-size: 14px; font-weight: 700; }
.mclose { width: 24px; height: 24px; border-radius: 50%; border: none; background: #f3f4f6; font-size: 14px; color: #666; }
.mbody { padding: 14px 18px; }
.mfoot { padding: 10px 18px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; justify-content: flex-end; }
.minfo { background: #f8faff; border: 1px solid #e0e7ff; border-radius: 7px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.7; }
.flabel { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #999; text-transform: uppercase; margin-bottom: 6px; }
.finput { width: 100%; background: #f9fafb; border: 1px solid #d1d5db; color: #111; padding: 9px 12px; border-radius: 7px; font-size: 13px; outline: none; transition: border-color .15s; }
.finput:focus { border-color: #2563eb; background: #fff; }
.fselect { width: 100%; background: #f9fafb; border: 1px solid #d1d5db; color: #111; padding: 9px 12px; border-radius: 7px; font-size: 13px; outline: none; appearance: none; cursor: pointer; }
.frow { margin-bottom: 12px; }

.ogrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
.ogrid3 { grid-template-columns: 1fr 1fr 1fr; }
.obtn { padding: 9px 6px; border-radius: 7px; border: 1.5px solid #e5e7eb; background: #f9fafb; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; transition: all .12s; color: #555; }
.obtn.disabled { opacity:0.42; cursor:not-allowed; pointer-events:none; background:#f3f4f6; }
.obtn:hover { border-color: #93c5fd; color: #1d4ed8; }
.obtn.sel { border-color: #2563eb !important; background: #dbeafe !important; color: #1d4ed8 !important; }
.obtn.s-annual.sel  { background: var(--c-leave)   !important; color: var(--c-leave-t)   !important; border-color: #c0a000 !important; }
.obtn.s-sick.sel    { background: var(--c-machoff)  !important; color: var(--c-machoff-t) !important; border-color: #c00    !important; }
.obtn.s-personal.sel{ background: var(--c-cryo)     !important; color: var(--c-cryo-t)   !important; border-color: #1a5c90 !important; }
.obtn.s-comp.sel    { background: #e8d5f5           !important; color: #5b21b6            !important; border-color: #7c3aed !important; }
.obtn.s-ot.sel      { background: var(--c-ot)       !important; color: var(--c-ot-t)     !important; border-color: #375623 !important; }

.tool-status { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; cursor:pointer; border:none; }
.ts-auto   { background:#c6efce; color:#276221; }
.ts-manual { background:#dce6f1; color:#17375e; }
.ts-down   { background:#ffc7ce; color:#9c0006; }
.ts-off    { background:#f2f2f2; color:#888; }
.ts-cryo   { background:#9dc3e6; color:#1a3a5c; }
.stag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; margin: 2px; transition: all .15s; }
.stag:hover { background: #1e40af; color: #fff; border-color: #1e40af; }
.stag .srm { cursor: pointer; color: #999; font-size: 12px; }
.stag .srm:hover { color: #ef4444; }

.legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.litem { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #555; }
.ldot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.1); flex-shrink: 0; }

.mtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.mtable th { text-align: left; padding: 8px 10px; background: #f0f4ff; border-bottom: 1px solid #c7d2fe; font-size: 11px; font-weight: 700; letter-spacing: .3px; color: #3730a3; }

<script>
// ═══════════════════════════════════════════════════════
// Google Sheets 整合模組（測試版）
// GS_URL 填入 Apps Script 部署的 Web App URL
// ═══════════════════════════════════════════════════════
// ★ 管理員設定後請把 Apps Script URL 填在這裡，讓所有員工自動使用雲端模式
const GS_DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbyo94pWgMv-5ZUP5Oy3i5zYoVUo02471GEQM93XwcXOG1-MHB_1FCVvuOnqW15DFUwFfQ/exec';
const GS_URL = localStorage.getItem('_gs_url') || GS_DEFAULT_URL;
if(GS_DEFAULT_URL && !localStorage.getItem('_gs_url')) {
  localStorage.setItem('_gs_url', GS_DEFAULT_URL);
}
let GS_MODE = !!GS_URL; // true=雲端模式, false=本地模式

// ── 呼叫 Apps Script（fetch + CORS，讀取用 GET，寫入用 POST 避免 URL 過長）──
const _GS_WRITE_ACTIONS = new Set(['saveChunk','setEmpIds','saveState','saveStage']);
async function gsCall(action, params={}) {
  const url = localStorage.getItem('_gs_url');
  if (!url) throw new Error('未設定 Apps Script URL');

  const allParams = { action, ...params };
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    let resp;
    if (_GS_WRITE_ACTIONS.has(action)) {
      // 寫入：POST + text/plain（繞過 CORS preflight，Apps Script 支援）
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(allParams),
        signal: controller.signal,
      });
    } else {
      // 讀取：GET + CORS
      const paramStr = Object.entries(allParams)
        .map(([k,v]) => {
          const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
          return encodeURIComponent(k) + '=' + encodeURIComponent(val);
        }).join('&');
      resp = await fetch(url + '?' + paramStr, { signal: controller.signal });
    }
    clearTimeout(timer);
    if (!resp.ok) throw new Error('連線失敗：HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || '伺服器錯誤');
    return data.data;
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('連線逾時（15秒）');
    if (e.message.startsWith('連線') || e.message.startsWith('伺服器')) throw e;
    throw new Error('連線失敗：請確認 Apps Script URL 正確');
  }
}

// ── 雲端登入（覆蓋本地 doLogin）──
async function gsLogin(empId, pwd) {
  const data = await gsCall('login', { empId, pwd });
  // 登入成功後同步一次完整 state
  const state = await gsCall('loadState', { empId });
  if (state && Object.keys(state).length > 0) {
    S = { ...defState(), ...state };
    LS_save(); // 同步到 localStorage 作 cache
  }
  return data; // {role, empId, name, shift, site}
}

// ── 雲端儲存（LS_save 的雲端版）──
let _gsSaveTimer = null;
function gsSave() {
  if (!GS_MODE) return;
  clearTimeout(_gsSaveTimer);
  _gsSaveTimer = setTimeout(async () => {
    try {
      // 把 state 分成4塊用 JSONP 分批儲存（解決 URL 長度和 CORS 限制）
      const chunks = [
        { // chunk 0：基本設定
          stage: S.stage,
          schedMonth: S.schedMonth,
          members: S.members,
          tools: S.tools,
          machineOff: S.machineOff,
          snapshots: S.snapshots,
        },
        { // chunk 1：假別申請
          phase1: S.phase1,
          phase2: S.phase2,
          phase3: S.phase3,
          emergencyLeave: S.emergencyLeave,
          emgAssign: S.emgAssign,
          emgDispatch: S.emgDispatch,
        },
        { // chunk 2：加班預排
          p2WaveStatus: S.p2WaveStatus,
          p3Requests: S.p3Requests,
          p3WaveStatus: S.p3WaveStatus,
          p3FinalSubmitted: S.p3FinalSubmitted,
          p3FinalSubmittedByAdmin: S.p3FinalSubmittedByAdmin,
        },
        { // chunk 3：機台分配
          toolAssign: S.toolAssign,
          pendingAssign: S.pendingAssign,
          dispatchAssign: S.dispatchAssign,
          pendingDispatch: S.pendingDispatch,
        }
      ];
      // 逐塊儲存
      for (let i = 0; i < chunks.length; i++) {
        await gsCall('saveChunk', {
          chunkId: i,
          totalChunks: chunks.length,
          data: JSON.stringify(chunks[i])
        });
      }
      document.getElementById('gs-status')?.classList.add('saved');
      setTimeout(() => document.getElementById('gs-status')?.classList.remove('saved'), 1500);
    } catch(e) {
      console.warn('雲端儲存失敗:', e.message);
      toast('⚠ 雲端儲存失敗，已存本地', 'warn');
    }
  }, 1200); // 1.2s debounce（等操作穩定後才儲存）
}

function LS_load() {
  try {
    const r = localStorage.getItem(LS_KEY);
    if(r){
      const saved = JSON.parse(r);
      S = {...defState(), ...saved}; // 先用預設填底，再用存檔覆蓋
      const def = defState();
      // members 名稱集合不符 → 強制重置（舊清單）
      const savedNames=(S.members||[]).map(m=>m.name).sort().join('|');
      const defNames=def.members.map(m=>m.name).sort().join('|');
      if(savedNames!==defNames){
        S.members=def.members;
        console.warn('[LS_load] members 清單已更新，重置為最新預設');
      } else {
        // 補齊每位成員缺少的欄位（site、skills）
        S.members=S.members.map(m=>{
          const dm=def.members.find(x=>x.name===m.name);
          if(!dm) return m;
          return {
            ...m,
            site: m.site||dm.site,
            skills: (m.skills&&m.skills.length>0)?m.skills:dm.skills,
            shift: m.shift||dm.shift,
          };
        });
      }
      // tools 數量不符 → 重置
      if((S.tools||[]).length!==def.tools.length){
        S.tools=def.tools;
        console.warn('[LS_load] tools 清單已更新，重置為最新預設');
      } else {
        // 補齊每台機台缺少的欄位
        S.tools=S.tools.map(t=>{
          const dt=def.tools.find(x=>x.id===t.id);
          return dt?{...dt,...t, id:t.id, site:dt.site, skills:dt.skills, model:dt.model}:t;
        });
      }
      // 補齊 state 欄位
      if(!S.dispatchAssign)  S.dispatchAssign={};
      if(!S.pendingDispatch)   S.pendingDispatch={};
      if(!S.pendingAssign)  S.pendingAssign={};
      if(!S.machineOff)     S.machineOff={};
      if(!S.phase1) S.phase1={};
      if(!S.phase2) S.phase2={};
      if(!S.phase3) S.phase3={};
    } else {
      S=defState();
    }
  } catch(e){ console.error('[LS_load]',e); S=defState(); }
}

// 只保留當前月份前後各一個月的資料
function pruneOldData() {
  const cur = S.schedMonth;
  // 計算有效月份範圍 (cur-1 ~ cur+1)
  function isValidDate(dateStr) {
    if(!dateStr) return false;
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return false;
    const dy = d.getFullYear(), dm = d.getMonth();
    // prev month
    let py = cur.y, pm = cur.m - 1;
    if(pm < 0) { pm = 11; py--; }
    // next month
    let ny = cur.y, nm = cur.m + 1;
    if(nm > 11) { nm = 0; ny++; }
    if(dy === py && dm === pm) return true;
    if(dy === cur.y && dm === cur.m) return true;
    if(dy === ny && dm === nm) return true;
    return false;
  }
  ['phase1','phase2','phase3'].forEach(p => {
    Object.keys(S[p]).forEach(k => {
      // key format: name_YYYY-MM-DD
      const dateStr = k.slice(k.lastIndexOf('_') + 1);
      if(!isValidDate(dateStr)) delete S[p][k];
    });
  });
  Object.keys(S.machineOff).forEach(k => {
    const dateStr = k.slice(k.lastIndexOf('_') + 1);
    if(!isValidDate(dateStr)) delete S.machineOff[k];
  });
  Object.keys(S.toolAssign).forEach(k => {
    const dateStr = k.slice(k.lastIndexOf('_') + 1);
    if(!isValidDate(dateStr)) delete S.toolAssign[k];
  });
  Object.keys(S.pendingAssign||{}).forEach(k => {
    const dateStr = k.slice(k.lastIndexOf('_') + 1);
    if(!isValidDate(dateStr)) delete S.pendingAssign[k];
  });
  Object.keys(S.dispatchAssign||{}).forEach(k => {
    const dateStr = k.slice(k.lastIndexOf('_') + 1);
    if(!isValidDate(dateStr)) delete S.dispatchAssign[k];
  });
  Object.keys(S.p3Requests||{}).forEach(k => {
    const dateStr = k.slice(k.lastIndexOf('_') + 1);
    if(!isValidDate(dateStr)) delete S.p3Requests[k];
  });
}

function LS_save() {

function dk(d) {
  if(!(d instanceof Date)) return d;
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function pd(s) { return new Date(s + 'T00:00:00'); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function monthDays(y, m) {
  const days = []; const total = new Date(y, m+1, 0).getDate();
  for(let d=1; d<=total; d++) days.push(new Date(y, m, d));
  return days;
}

function getStatus(name, date) {
  const mem = S.members.find(x => x.name === name);
  if(!mem) return { type:'work', base:'work' };
  const base = shiftWork(date, mem.shift);
  const key = name + '_' + dk(date);
  const p1 = S.phase1[key];
  const p2 = S.phase2[key];
  const p3 = S.phase3[key];
  if(p1 && p1.type) return { type:p1.type, base, src:'p1', note:p1.note, noOt:!!p1.noOt };
  if(p1 && p1.noOt) return { type:base, base, src:'p1', noOt:true }; // noOt-only，無假別
  if(p3) return { type:p3.confirmed?'ot':'off', base, src:'p3', confirmed:p3.confirmed };
  // p3WaveStatus.draft：管理員 p3 草稿（人員確認前）
  if(S.p3WaveStatus?.draft?.[key]) return { type:'preot', base, src:'p3draft' };
  if(S.p3Requests?.[key]) return { type:'ot', base, src:'p3req' };
  if(p2) return { type:(p2.confirmed===true)?'ot':(p2.confirmed===false?'preot':'ot'), base, src:'p2', confirmed:!!p2.confirmed };
  return { type:base, base };
}

// 判斷某天是否算「工作」(含加班預排，不含補休類國假)
function isWorkingDay(status, dateStr) {
  // 連七計算用：上班日一律算出勤（即使請假）
  const base = status.base;
  const t = status.type;
  if(base === 'work') return true;
  if(['ot','preot','comp_off','hol_ot','hol_comp'].includes(t)) return true;
  return false;
}
function isActuallyWorking(status, dateStr) {
  // 人力缺額計算用：判斷該人今天是否真正出勤（會到現場）
  // 不出勤假別（無論上班日或休假日）
  const OFF_TYPES=['off','annual','sick','physio','maternity','family','infant','funeral','personal','hol_leave','comp'];
  if(OFF_TYPES.includes(status.type)) return false;
  // 出勤：work（無請假）/ comp_off / hol_comp / hol_ot / ot / preot
  return true;
}

// 回傳 {consec: bool, holAllOT: bool}
// consec: 7天內無休
// holAllOT: 當週所有國假都排加班（補休類不算）
// markType: 'ot'(預排加班)|'comp'(補休) 決定標記類型
function checkWeekRules(name, date, markOT, markType) {
  const actualMarkType = (typeof markType === 'string') ? markType : 'ot';
  const dow = date.getDay();
  const weekStart = addDays(date, -(dow===0?6:dow-1)); // 週一起始

  let consecMax = 0, run = 0;
  let holCount = 0, holOTCount = 0;

  for(let i = -7; i <= 7; i++) {
    const d = addDays(date, i);
    let s = getStatus(name, d);
    const ds = dk(d);
    if(markOT && ds === dk(date)) s = { type: actualMarkType };
    if(isWorkingDay(s, ds)) { run++; consecMax = Math.max(consecMax, run); }
    else run = 0;
  }

  // 當週國假檢查：只有 ot 類才算，補休類(comp/hol_leave/annual...)不算
  if(markOT && actualMarkType === 'ot') {
    for(let i=0; i<7; i++) {
      const d = addDays(weekStart, i);
      const ds = dk(d);
      if(isHoliday(ds)) {
        holCount++;
        let s = getStatus(name, d);
        if(ds === dk(date)) s = { type: 'ot' };
        if(['ot','ot_hol'].includes(s.type)) holOTCount++;
      }
    }
  }

  return {
    consec: consecMax >= 7,
    holAllOT: holCount > 0 && holOTCount >= holCount
  };
}

// backward compat wrapper
function checkConsec(name, date, markOT) {
  return checkWeekRules(name, date, markOT).consec;
}
// 統一連七檢查 helper：模擬加班後是否連7天
function wouldCause7Consec(name, date){
  return checkWeekRules(name, date, true).consec;
}
// 連七檢查（考慮臨時草稿 pending，不修改 S.phase2）
function checkConsecWithPending(name, date, pending){
  // 直接計算：不依賴 S.phase2 注入，避免 getStatus 快取問題
  const mem = S.members.find(x=>x.name===name);
  if(!mem) return false;
  // 判斷某天是否出勤（含 pending 草稿）
  // 連七定義：上班日(base=work)=永遠出勤；休假日=有加班才出勤
  function isWorking(d){
    const ds=dk(d);
    const base=shiftWork(d, mem.shift);
    const key=name+'_'+ds;
    if(base==='work') return true; // 上班日，即使請假也算出勤（當班日）
    // 休假日：有加班才出勤
    if(S.phase2[key] || pending[key] || S.p3Requests?.[key]) return true;
    if(S.phase3?.[key]?.confirmed) return true;
    return false;
  }
  
  // 模擬目標日加班後，計算 ±10 天內最大連續出勤天數
  let consecMax=0, run=0;
  for(let i=-10; i<=10; i++){
    const d=addDays(date, i);
    const ds=dk(d);
    let working;
    if(ds===dk(date)){
      working=true; // 模擬目標日加班
    } else {
      working=isWorking(d);
    }
    if(working){ run++; consecMax=Math.max(consecMax,run); }
    else run=0;
  }
  return consecMax>=7;
}




// 技能縮寫
function skillAbbr(skills){
  // 只顯示技能縮寫，派工/雙棲由獨立標籤顯示
  const map={'ARM':'A','ARMauto':'Ax','CS':'C','CSauto':'Cx','nonCS':'N','P-dipole':'P','代理':'代'};

// ── 人力計算 ──
const AUTO_SKILLS = ['ARMauto','CSauto','remote'];
function hasAutoSkill(mem){ return (mem.skills||[]).some(s=>AUTO_SKILLS.includes(s)); }
function toolIsAuto(tool){ return (tool.status||'auto')==='auto'; }
function memberPower(mem){
  // 有派工技能 → 1.5；有auto技能 → 1.5；一般 → 1.0
  if((mem.skills||[]).includes('派工')) return 1.5;
  return hasAutoSkill(mem)?1.5:1.0;
}
function toolCost(tool){ return toolIsAuto(tool)?0.5:1.0; }
function toolIsRemote(tool){ return (tool.skills||[]).includes('remote'); }
// 對班關係：NA↔NB，DA↔DB
// 班別時段：NA/NB=夜班(19:20-7:20)，DA/DB=日班(7:20-19:20)
// 加班互補：同時段另一班 NA↔NB，DA↔DB
function pairShiftOf(sf){ return {NA:'NB',NB:'NA',DA:'DB',DB:'DA'}[sf]||''; }
// 對班加班人員：NA↔NB, DA↔DB，當天為休假日且有 phase2 預排
function getOTMembers(dateStr, sf){
  const pair=pairShiftOf(sf); // NA→NB, NB→NA, DA→DB, DB→DA
  return S.members.filter(mem=>{
    if(mem.shift!==pair) return false;
    const base=shiftWork(pd(dateStr),mem.shift); // 確認是對班的休假日
    if(base!=='off') return false;
    return !!S.phase2[mem.name+'_'+dateStr]; // 有預排加班
  });
}


// ── 班別機台分配 key helper ──
// key 格式：班別_機台ID_日期  確保四班各自獨立
function taKey(sf, toolId, dateStr){ return sf+'_'+toolId+'_'+dateStr; }
function taGet(sf, toolId, dateStr){ return S.toolAssign[taKey(sf,toolId,dateStr)]; }
function taSet(sf, toolId, dateStr, val){ S.toolAssign[taKey(sf,toolId,dateStr)]=val; }
function taDel(sf, toolId, dateStr){ delete S.toolAssign[taKey(sf,toolId,dateStr)]; }
function paGet(sf, toolId, dateStr){ return S.pendingAssign[taKey(sf,toolId,dateStr)]; }
function paSet(sf, toolId, dateStr, val){ S.pendingAssign[taKey(sf,toolId,dateStr)]=val; }
function paDel(sf, toolId, dateStr){ delete S.pendingAssign[taKey(sf,toolId,dateStr)]; }
// 取得某天某班所有已分配的人員 {name: site}
function getAssignedPersonSite(sf, dateStr, includePA){
  const map={};
  const process=(obj)=>Object.entries(obj).forEach(([k,v])=>{
    if(!k.startsWith(sf+'_')||!k.endsWith('_'+dateStr)) return;
    if(!v||v==='空機'||v==='停機') return;
    const parts=k.split('_'); // [sf, toolId, dateStr] but toolId may have _
    // key = sf_toolId_YYYY-MM-DD
    const toolId=k.slice(sf.length+1, k.length-dateStr.length-1);
    const t=S.tools.find(x=>x.id===toolId);
    if(t) map[v]=t.site;
  });
  process(S.toolAssign);
  if(includePA) process(S.pendingAssign);
  return map;
}

function testFillNoOt(){

  S.members.forEach(mem=>{
    days.forEach(d=>{
      if(shiftWork(d,mem.shift)!=='off') return; // 只在休假日
      if(Math.random()>0.3) return; // 30% 機率標記
      const ds=dk(d);
      const key=mem.name+'_'+ds;
      const cur=S.phase1[key]||{};
      if(cur.noOt) return; // 已標記跳過
      S.phase1[key]={...cur, noOt:true};
      cnt++;
    });

function testFillLeave(){
  const {y,m}=S.schedMonth; const days=monthDays(y,m);

  const holLeavePool=['hol_comp','hol_ot','hol_leave'];
  let cnt=0;
  S.members.forEach(mem=>{
    days.forEach(d=>{
      if(shiftWork(d,mem.shift)!=='work') return;
      if(Math.random()>0.25) return; // 25% 機率設定假別
      const ds=dk(d);
      const key=mem.name+'_'+ds;

      let pool=leavePool;

      const t=pool[Math.floor(Math.random()*pool.length)];

        } else {
          const siteSkills={'P2':['CS'],'P6':['nonCS'],'P7':['ARMauto'],'P8':['ARM']};
          S.members.push({id:++maxId,name:emp.name,shift:emp.shift,site:emp.site,empId:emp.empId,pwd:emp.pwd,skills:siteSkills[emp.site]||[],prefTool:[]});
          added++;
        }
      });
      if(added>0){ LS_save(); renderApp(); toast(`已自動同步 ${added} 位新員工至排班系統`,'ok'); }
    }).catch(()=>{});
  }
}

function adminMoNav(n) {
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  // 計算前後各一個月的邊界
  let prevY = curY, prevM = curM - 1;
  if(prevM < 0) { prevM = 11; prevY--; }
  let nextY = curY, nextM = curM + 1;
  if(nextM > 11) { nextM = 0; nextY++; }

  let ny = S.schedMonth.y, nm = S.schedMonth.m + n;
  if(nm > 11) { nm = 0; ny++; }
  if(nm < 0)  { nm = 11; ny--; }

  // 不超出範圍
  const tooOld = ny < prevY || (ny === prevY && nm < prevM);
  const tooNew = ny > nextY || (ny === nextY && nm > nextM);
  if(tooOld || tooNew) { toast('只能查看前後各一個月','info'); return; }

  S.schedMonth.y = ny; S.schedMonth.m = nm;
  LS_save(); renderAdminTab();
}

  return `<div style="display:flex;align-items:center;gap:6px">

    <span style="font-size:14px;font-weight:700;min-width:90px;text-align:center">${S.schedMonth.y}年${S.schedMonth.m+1}月</span>

  </div>`;
}

  // ── 出勤人員 ──
  const onDuty = S.members.filter(m=>{
    if(m.shift!==sf||(m.skills||[]).includes('雙棲')) return false;
    const s=getStatus(m.name,d);
    return s.base==='work'&&isActuallyWorking(s,dateStr);
  });
  const otDuty = S.members.filter(m=>{
    if(m.shift!==pairSf||(m.skills||[]).includes('雙棲')) return false;
    const key=m.name+'_'+dateStr;

    const k=sfPfx+site+'_'+dateStr;

  const origDisp = site   => S.dispatchAssign?.[sfPfx+site+'_'+dateStr]||'';

  // ── 缺額 ──

function toggleEmergencyLeave(name, dateStr, sf){
  if(!S.emergencyLeave) S.emergencyLeave={};
  if(!S.emgAssign)      S.emgAssign={};
  if(!S.emgDispatch)    S.emgDispatch={};
  const key=sf+'_'+name+'_'+dateStr;
  const sfPfx=sf+'_';

  if(S.emergencyLeave[key]){
    // 恢復出勤：清除臨請記錄，恢復原始機台
    delete S.emergencyLeave[key];
    // 刪除 emgAssign 中此人被清除的空機記錄（讓原始分配重新顯示）
    const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');
    allActive.forEach(tool=>{
      const tk=sfPfx+tool.id+'_'+dateStr;
      const orig=S.toolAssign[tk]||S.pendingAssign[tk]||'';
      if(S.emgAssign[tk]==='空機'&&orig===name) delete S.emgAssign[tk];
    });
    ['P2','P6','P8'].forEach(site=>{
      const dk2=sfPfx+site+'_'+dateStr;
      if(S.emgDispatch[dk2]==='空機'){
        const origD=S.dispatchAssign?.[dk2]||''
        if(origD===name) delete S.emgDispatch[dk2];
      }
    });
    LS_save(); renderAdminTab();
    toast(name+' 恢復出勤','ok');
    return;
  }

  // 使用 OM 確認彈窗（避免 confirm() 在 iframe 被攔截）
  OM('臨時請假確認',
    '<div style="padding:12px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">確定標記 '+name+' 臨時請假？</div><div style="font-size:12px;color:#555">此人當日機台分配將改為空機。</div></div>',
    '<button class="btn btn-ghost" onclick="CM()">取消</button><button class="btn btn-danger" onclick="_doEmgLeave(\''+ name +'\',\''+ dateStr +'\',\''+ sf +'\')">確定臨請</button>'
  );
}

function _doEmgLeave(name, dateStr, sf){
  CM();
  if(!S.emergencyLeave) S.emergencyLeave={};
  if(!S.emgAssign)      S.emgAssign={};
  if(!S.emgDispatch)    S.emgDispatch={};
  const key=sf+'_'+name+'_'+dateStr;
  const sfPfx=sf+'_';
  S.emergencyLeave[key]={name,dateStr,sf,time:new Date().toISOString()};
  // 把 toolAssign/pendingAssign/emgAssign 中此人的機台全標為空機
  const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');
  allActive.forEach(tool=>{
    const tk=sfPfx+tool.id+'_'+dateStr;
    const curVal=S.emgAssign[tk]!==undefined?S.emgAssign[tk]:(S.toolAssign[tk]||S.pendingAssign[tk]||'');
    if(curVal===name) S.emgAssign[tk]='空機';
  });
  // 派工
  ['P2','P6','P8'].forEach(site=>{
    const dk2=sfPfx+site+'_'+dateStr;
    const curDisp=S.emgDispatch[dk2]!==undefined?S.emgDispatch[dk2]:(S.dispatchAssign?.[dk2]||'');
    if(curDisp===name) S.emgDispatch[dk2]='空機';
  });
  addNotif('emg_leave',name+' '+dateStr+' 臨時請假（'+sf+'班）');
  LS_save(); renderAdminTab();
  toast(name+' 已標記臨時請假','info');
}

// 手動指定機台人員（與 assignTool 相同規則）
function emgPickTool(toolId){
  if(!S.emgAssign)   S.emgAssign={};
  if(!S.emgDispatch) S.emgDispatch={};
  const sf=_emgSf, dateStr=_emgDate, d=pd(dateStr), pairSf=pairShiftOf(sf), sfPfx=sf+'_';
  const isDisp=toolId.startsWith('__disp__');
  const site=isDisp?toolId.replace('__disp__',''):'';
  const tool=isDisp?null:S.tools.find(t=>t.id===toolId);
  const tsk=isDisp?[]:tool.skills||[];
  const cost=isDisp?1:toolCost(tool);
  const isAuto=isDisp?false:toolIsAuto(tool);

  const curKey=isDisp?(sfPfx+site+'_'+dateStr):(sfPfx+toolId+'_'+dateStr);
  const curEmg=isDisp?S.emgDispatch[curKey]:S.emgAssign[curKey];
  const curOrig=isDisp?(S.dispatchAssign?.[curKey]||''):(S.toolAssign[curKey]||S.pendingAssign[curKey]||'');
  const cur=curEmg!==undefined?curEmg:curOrig;

  // 臨時請假排除
  const emgNames=new Set(Object.keys(S.emergencyLeave||{}).filter(k=>k.startsWith(sf+'_')&&k.endsWith('_'+dateStr)).map(k=>k.split('_')[1]));

  // 計算每人在 emgAssign 的機台數/auto數/site
  const ptc={},pac={},psite={};
  S.tools.filter(t=>(t.status||'auto')!=='off').forEach(t=>{
    const ek=sfPfx+t.id+'_'+dateStr;
    const v=S.emgAssign[ek]!==undefined?S.emgAssign[ek]:(S.toolAssign[ek]||S.pendingAssign[ek]||'');
    if(!v||v==='空機'||v==='停機') return;
    ptc[v]=(ptc[v]||0)+1;
    if(toolIsAuto(t)) pac[v]=(pac[v]||0)+1;
    psite[v]=t.site;
  });
  // 派工佔用（也記錄人員被鎖定的 site）
  const pdispUsed=new Set();
  ['P2','P6','P8'].forEach(s2=>{
    const dk2=sfPfx+s2+'_'+dateStr;
    const v=S.emgDispatch[dk2]!==undefined?S.emgDispatch[dk2]:(S.dispatchAssign?.[dk2]||'');
    if(v&&v!=='空機'){
      pdispUsed.add(v);
      if(!psite[v]) psite[v]=s2; // 派工鎖定 site
    }
  });

  // 候選人池
  const candidates=S.members.filter(mem=>{
    if(emgNames.has(mem.name)) return false;
    if(mem.shift===sf){ const s=getStatus(mem.name,d); return s.base==='work'&&isActuallyWorking(s,dateStr); }
    if(mem.shift===pairSf){
      if(shiftWork(d,mem.shift)!=='off') return false;
      if(!S.phase2[mem.name+'_'+dateStr]) return false;
      const s=getStatus(mem.name,d); return isActuallyWorking(s,dateStr);
    }
    return false;
  });

  window._emgPickId=toolId;
  window._emgPickSel=cur||'空機';

  // 傳入前先過濾 site 衝突（已在其他 site 的人完全排除）
  const candidatesFiltered2=candidates.filter(mem=>{
    if(mem.name===cur) return true;
    const ms=psite[mem.name];
    if(ms && ms!==tool.site) return false;
    return true;
  });
  // 用共用 _evalCandidates 評估（優先順序：prefTool > AUTO > 技能少）
  const rows=_evalCandidates({
    candidates:candidatesFiltered2, tool, tsk, cost, isAuto, cur,
    ptc, pac, psite, pdispUsed, sfPfx, dateStr, isDisp, dispSite:site
  }).map(r=>({...r, isOT:r.mem.shift===pairSf}));

  const html=rows.map(({mem,disabled,reasons,isOT,isPref,hasAutoSkill:haA,skillCount,tc,ac2})=>{
    const sel=cur===mem.name;
    const otTag=isOT?'<span style="font-size:8px;color:#16a34a;font-weight:700">加班</span>'
                    :`<span style="font-size:8px;color:#2563eb;font-weight:700">${mem.shift}</span>`;
    const prefTag=isPref?' <span style="font-size:8px;color:#d97706">★</span>':'';
    const autoTag=haA?'<span style="font-size:8px;color:#7c3aed">A</span>':'';
    const tcTag=tc>0?`<span style="font-size:8px;color:#64748b">${tc}機</span>`:'';
    const reasonTag=disabled?`<span style="font-size:8px;color:#ef4444;display:block">${reasons[0]}</span>`:'';
    const cls=`obtn${sel?' sel':''}${disabled?' disabled':''}`;
    const disStyle=disabled?'opacity:0.45;cursor:not-allowed;':'cursor:pointer;';
    return `<div class="${cls}" data-pick="${mem.name}" style="${disStyle}">
      <div style="display:flex;justify-content:space-between">${otTag}${prefTag}${autoTag}${tcTag}</div>
      <div style="font-size:11px;font-weight:600">${mem.name}</div>
      ${reasonTag}
    </div>`;
  }).join('');

  const emptyBtn=`<div class="obtn${(!cur||cur==='空機')?' sel':''}" data-pick="空機" style="border-color:#fca5a5;color:#ef4444;cursor:pointer">✕ 空機</div>`;

  OM(`分配 ${isDisp?'派工·'+site:toolId}（臨時）`,
    `<div class="minfo"><b>${isDisp?'派工':'技能'}</b>: ${isDisp?site:tsk.join('/')}　<b>目前</b>: ${cur||'空機'}</div>
    <div class="ogrid ogrid3" id="emgOpts">
      ${html||'<div style="grid-column:1/-1;color:#999;font-size:12px;padding:6px">⚠ 無符合條件人員</div>'}
      ${emptyBtn}
    </div>`,
    `<button class="btn btn-ghost" onclick="CM()">取消</button><button class="btn btn-primary" onclick="_doEmgPick()">確認</button>`);

  setTimeout(()=>{
    const opts=document.getElementById('emgOpts');
    if(!opts) return;
    opts.querySelectorAll('[data-pick]').forEach(el=>{
      if(el.classList.contains('disabled')) return;
      el.addEventListener('click',function(){
        opts.querySelectorAll('.obtn').forEach(b=>b.classList.remove('sel'));
        this.classList.add('sel');
        window._emgPickSel=this.getAttribute('data-pick');
      });
    });
  },50);
}

function _doEmgPick(){
  const sf=_emgSf,dateStr=_emgDate,sfPfx=sf+'_';
  const toolId=window._emgPickId,val=window._emgPickSel||'空機';
  if(!S.emgAssign)   S.emgAssign={};
  if(!S.emgDispatch) S.emgDispatch={};
  if(toolId.startsWith('__disp__')){
    S.emgDispatch[sfPfx+toolId.replace('__disp__','')+'_'+dateStr]=val;
  } else {
    S.emgAssign[sfPfx+toolId+'_'+dateStr]=val;
  }
  LS_save(); CM(); renderAdminTab(); toast('已更新臨時分配','ok');
}

function emgAutoAssign(){
  const sf=_emgSf, dateStr=_emgDate;
  if(!S.emgAssign)   S.emgAssign={};
  if(!S.emgDispatch) S.emgDispatch={};
  const d=pd(dateStr), pairSf=pairShiftOf(sf), sfPfx=sf+'_';
  const emgNames=new Set(Object.keys(S.emergencyLeave||{}).filter(k=>k.startsWith(sf+'_')&&k.endsWith('_'+dateStr)).map(k=>k.split('_')[1]));
  // 清除臨時分配，並把原始分配也清空（避免 fallback 顯示舊資料）
  Object.keys(S.emgAssign).filter(k=>k.startsWith(sfPfx)&&k.endsWith('_'+dateStr)).forEach(k=>delete S.emgAssign[k]);
  Object.keys(S.emgDispatch).filter(k=>k.startsWith(sfPfx)&&k.endsWith('_'+dateStr)).forEach(k=>delete S.emgDispatch[k]);
  // 把原始 toolAssign/pendingAssign 中有分配的機台先預設為空機（runP 再覆蓋）
  S.tools.filter(t=>(t.status||'auto')!=='off').forEach(t=>{
    const tk=sfPfx+t.id+'_'+dateStr;
    if(S.toolAssign[tk]||S.pendingAssign[tk]) S.emgAssign[tk]='空機';
  });
  ['P2','P6','P8'].forEach(site=>{
    const dk=sfPfx+site+'_'+dateStr;
    if(S.dispatchAssign?.[dk]) S.emgDispatch[dk]='空機';
  });
  // 可用人力
  const onDuty=S.members.filter(m=>m.shift===sf&&!(m.skills||[]).includes('雙棲')&&!emgNames.has(m.name)&&(()=>{const s=getStatus(m.name,d);return s.base==='work'&&isActuallyWorking(s,dateStr);})());
  const otDuty=S.members.filter(m=>{
    if(m.shift!==pairSf||(m.skills||[]).includes('雙棲')||emgNames.has(m.name))return false;
    const key=m.name+'_'+dateStr;
    if(!(S.phase2[key]||S.p3Requests[key]))return false;
    const s2=getStatus(m.name,d); return isActuallyWorking(s2,dateStr);
  });
  const dualRole=S.members.filter(m=>m.shift===sf&&(m.skills||[]).includes('雙棲')&&(()=>{const s=getStatus(m.name,d);return s.base==='work'&&isActuallyWorking(s,dateStr);})());
  const pl={},tc={},ac={};
  [...onDuty,...otDuty,...dualRole].forEach(m=>{pl[m.name]=memberPower(m);tc[m.name]=0;ac[m.name]=0;});
  const used=new Set();
  // 派工
  ['P2','P6','P8'].forEach(site=>{
    const c=[...onDuty,...otDuty].find(m=>!used.has(m.name)&&(m.skills||[]).includes('派工')&&m.site===site)
           ||[...onDuty,...otDuty].find(m=>!used.has(m.name)&&(m.skills||[]).includes('代理')&&m.site===site);
    if(c){S.emgDispatch[sfPfx+site+'_'+dateStr]=c.name;used.add(c.name);pl[c.name]=Math.max(0,pl[c.name]-0.5);}// 派工消耗0.5
    else S.emgDispatch[sfPfx+site+'_'+dateStr]='空機';
  });
  const asgn={};
  const asite=name=>{for(const[k,v] of Object.entries(asgn)){if(v===name){const t=S.tools.find(x=>x.id===k);if(t)return t.site;}}return null;};
  const fc=(pool,tsk,cost,tsite,mode,allowD=false)=>{
    const u=new Set([...used,...Object.values(asgn).filter(v=>v&&v!=='空機')]);
    const b=pool.filter(m=>{
      if(!allowD&&(m.skills||[]).includes('雙棲'))return false;
      if(!tsk.some(s=>(m.skills||[]).includes(s)))return false;
      if((tc[m.name]||0)>=2)return false;
      const ms=asite(m.name);if(ms&&ms!==tsite)return false;
      const a=ac[m.name]||0,mc2=(tc[m.name]||0)-a;
      const ec=(cost>=1&&a>=1)?Math.min(cost,pl[m.name]||0):cost;
      if((pl[m.name]||0)<ec)return false;
      if(mode==='auto_first'){if(u.has(m.name)||a>=1)return false;}
      else if(mode==='manual_pair'){if(mc2>=1)return false;}
      else if(mode==='auto_second'){if(u.has(m.name))return false;}
      return true;
    });
    if(!b.length)return null;
    if(['manual_pair','manual_fill'].includes(mode)){const p=b.filter(m=>(ac[m.name]||0)>=1);return p.length?p[0]:b[0];}
    return b.sort((x,y)=>(tc[x.name]||0)-(tc[y.name]||0))[0];
  };
  const doA=(tid,m,tool)=>{
    const cost=toolCost(tool),a=ac[m.name]||0;
    const ec=(cost>=1&&a>=1)?Math.min(cost,pl[m.name]||0):cost;
    asgn[tid]=m.name;pl[m.name]=Math.max(0,pl[m.name]-ec);tc[m.name]++;if(toolIsAuto(tool))ac[m.name]++;
    S.emgAssign[sfPfx+tid+'_'+dateStr]=m.name;
  };
  const allAct=S.tools.filter(t=>(t.status||'auto')!=='off');
  const p2p8=allAct.filter(t=>['P2','P8'].includes(t.site)&&!toolIsRemote(t));
  const p7=allAct.filter(t=>t.site==='P7'&&!toolIsRemote(t));
  const p6=allAct.filter(t=>t.site==='P6'&&!toolIsRemote(t));
  const runP=(sT,lim=null)=>{
    const aT=sT.filter(t=>toolIsAuto(t)),mT=sT.filter(t=>!toolIsAuto(t));
    [['auto_first',aT],['manual_pair',mT],['auto_second',aT],['manual_fill',mT]].forEach(([mode,tlist])=>{
      let cnt=0;tlist.forEach(tool=>{
        if(lim!==null&&cnt>=lim)return;
        const isR=['auto_second','manual_fill'].includes(mode);
        if(isR&&asgn[tool.id]!=='空機')return;
        if(!isR&&asgn[tool.id])return;
        if(S.machineOff?.[tool.id+'_'+dateStr]){asgn[tool.id]='停機';S.emgAssign[sfPfx+tool.id+'_'+dateStr]='停機';return;}
        const tsk=tool.skills||[],cost=toolCost(tool);
        let cand=null;
        for(const pool of [[...onDuty,...otDuty].filter(m=>m.site===tool.site),[...onDuty,...otDuty]]){cand=fc(pool,tsk,cost,tool.site,mode);if(cand)break;}
        if(!cand)cand=fc(dualRole,tsk,cost,tool.site,['auto_second','manual_fill'].includes(mode)?mode:'manual_fill',true);
        if(cand){if(isR)delete asgn[tool.id];doA(tool.id,cand,tool);cnt++;}
        else if(!isR){asgn[tool.id]='空機';S.emgAssign[sfPfx+tool.id+'_'+dateStr]='空機';}
      });
    });
  };
  const p7Has=p7.some(tool=>{const mk=sfPfx+tool.id+'_'+dateStr;return asgn[tool.id]&&asgn[tool.id]!=='空機';});
  runP(p2p8);if(!p7Has)runP(p7,1);runP(p6);runP(p7);
  LS_save();renderAdminTab();
  toast('臨時分配完成（'+Object.values(asgn).filter(v=>v&&v!=='空機'&&v!=='停機').length+'台）','ok');
}

function emgClearAssign(){
  const sf=_emgSf, dateStr=_emgDate, sfPfx=sf+'_';
  if(!S.emgAssign)   S.emgAssign={};
  if(!S.emgDispatch) S.emgDispatch={};
  // 清除 emgAssign/emgDispatch 的臨時記錄
  Object.keys(S.emgAssign).filter(k=>k.startsWith(sfPfx)&&k.endsWith('_'+dateStr)).forEach(k=>delete S.emgAssign[k]);
  Object.keys(S.emgDispatch).filter(k=>k.startsWith(sfPfx)&&k.endsWith('_'+dateStr)).forEach(k=>delete S.emgDispatch[k]);
  // 把原始 toolAssign/pendingAssign 的所有機台也寫入 emgAssign 為空機（完全清空當日分配）
  const allAct=S.tools.filter(t=>(t.status||'auto')!=='off');
  allAct.forEach(tool=>{
    const tk=sfPfx+tool.id+'_'+dateStr;
    if(S.toolAssign[tk]||S.pendingAssign[tk]) S.emgAssign[tk]='空機';
  });
  // 派工清空
  ['P2','P6','P8'].forEach(site=>{
    const dk=sfPfx+site+'_'+dateStr;
    if(S.dispatchAssign?.[dk]) S.emgDispatch[dk]='空機';
  });
  LS_save();renderAdminTab();toast('已清除當日所有機台分配','info');
}

      const isPend=(S.phase2[mem.name+'_'+dateStr]&&!S.phase3[mem.name+'_'+dateStr])||!!(S.p3WaveStatus?.draft?.[mem.name+'_'+dateStr]);
      // noOt 標記：顯示在 off 的休假日格子上
      // noOt 日：顯示 X（鎖定，所有階段都顯示）
      const noOtDisplay = noOt && t==='off';
      const finalLbl = noOtDisplay ? 'X' : lbl;
      const finalCls = noOtDisplay ? 'dc-off' : cls;
      const noOtStyle = noOtDisplay ? 'color:#dc2626;font-weight:900;font-size:13px;' : '';
      if(editable){
        if(noOtDisplay){
          // noOt 鎖定，不可點
          tbody+=`<td style="padding:0"><div class="dc ${finalCls}" style="cursor:not-allowed;${noOtStyle}">${finalLbl}</div></td>`;
        } else if(t==='off'){
          // 休假日可點（管理員可新增假別或加班）
          tbody+=`<td style="padding:0"><div class="dc ${finalCls}" onclick="adminEditCell('${mem.name}','${dateStr}')" style="cursor:pointer">${finalLbl}</div></td>`;
        } else {
          tbody+=`<td style="padding:0"><div class="dc ${finalCls}${isPend?' dc-pend':''}" onclick="adminEditCell('${mem.name}','${dateStr}')" style="${noOtStyle}">${finalLbl}</div></td>`;
        }
      } else {
        tbody+=`<td style="padding:0"><div class="dc ${finalCls}" style="${noOtStyle}">${finalLbl}</div></td>`;
      }
    });
    // 統計欄（最右，sticky）
    let otCnt=0,lvCnt=0;
    days.forEach(d2=>{
      const s2=getStatus(mem.name,d2);
      if(['ot','comp_off','hol_ot'].includes(s2.type)) otCnt++;
      if(LEAVE_TYPES_REST.includes(s2.type)) lvCnt++;
    });
    tbody+=`<td style="font-size:10px;font-weight:700;text-align:center;background:#f0f4ff;padding:1px 3px;min-width:52px;position:sticky;right:0;z-index:10"><span style="color:#16a34a">+${otCnt}</span><br><span style="color:#dc2626">${lvCnt}休</span></td>`;
    tbody+='</tr>';
  });
  tbody+='</tbody>';

  // ── tfoot：在班人數 ──
  // tfoot：每班每天顯示 出勤人數/手動機台缺額
  const allActiveT=S.tools.filter(t=>(t.status||'auto')!=='off');
  const manualT=allActiveT.filter(t=>!toolIsAuto(t)).length; // 需要真人的機台數
  let tfoot='<tfoot>';
  SHIFTS.forEach(shift=>{
    const mems=S.members.filter(x=>x.shift===shift);
    if(!mems.length) return;
    const pairSfT=pairShiftOf(shift);
    tfoot+=`<tr><td class="col-no" style="font-size:9px">${shift}</td><td class="col-id" style="font-size:10px;font-weight:700;text-align:left;padding-left:5px">人力缺額</td><td class="col-site"></td>`;
    days.forEach(d=>{
      const dateStr=dk(d);
      const base=shiftWork(d,shift);
      if(base==='off'){
        tfoot+=`<td style="background:#f5f5f5;color:#ccc;text-align:center;font-size:10px">—</td>`;return;
      }
      // 出勤人數（含報-補休/加班費，排除請假）
      let onDuty=0;
      mems.forEach(mem=>{const s=getStatus(mem.name,d);if(isActuallyWorking(s,dateStr))onDuty++;});
      // 對班已確認加班人數
      const pairOT=S.members.filter(m=>m.shift===pairSfT&&!!S.phase2[m.name+'_'+dateStr]).length;
      const deficit=Math.max(0,manualT-onDuty-pairOT);
      const cls=deficit===0?'def-ok':deficit<=2?'def-warn':'def-bad';
      tfoot+=`<td class="${cls}" style="font-size:10px;font-weight:700;text-align:center" title="手動機台:${manualT} 出勤:${onDuty} 加班:${pairOT}">${deficit>0?'-'+deficit:'✓'}</td>`;
    });
    tfoot+='<td style="background:#f0f4ff"></td></tr>';
  });
  tfoot+='</tfoot>';

  wrap.innerHTML=`<table class="sheet">${thead}${tbody}${tfoot}</table>`;
}


function adminEditCell(name, dateStr) {
  const mem = S.members.find(x => x.name===name);
  const d = pd(dateStr);
  const s = getStatus(name, d);
  _cellEdit = { name, dateStr };
  _cellSel = s.type;
  const key = name+'_'+dateStr;
  const isWork = s.base === 'work';
  const hol = isHoliday(dateStr);
  const holName = hol ? getHolidayName(dateStr) : '';
  const isPreOT = !!S.phase2[key];
  const isP3Draft = !!(S.p3WaveStatus?.draft?.[key]); // stage3 草稿
  const isNoOt = !!(S.phase1[key]?.noOt);

  // ── 休假日 noOt（拒絕加班）：鎖定不可更改 ──
  if(!isWork && isNoOt && !isPreOT){
    OM(`🔒 ${name} — ${dateStr}（拒絕加班）`,
      `<div class="minfo" style="color:#dc2626;font-weight:700">✕ 本日已標記拒絕加班，不可更改</div>
      <div style="font-size:11px;color:#888;padding:8px 0">人員已選擇此日不接受加班安排</div>`,
      `<button class="btn btn-ghost" onclick="CM()">關閉</button>`);
    return;
  }

  // ── stage3 P加班草稿：只顯示取消 ──
  if(!isWork && isP3Draft && S.stage===3){
    OM(`✏️ ${name} — ${dateStr}（P加班預排）`,
      `<div class="minfo"><b>班別：</b>${mem.shift}　<b>目前：</b>P加班預排（待人員確認）</div>
      <div class="ogrid" id="ceOpts">
        <div class="obtn" onclick="pickCE('__cancel_p3draft__',this)">✕ 取消P加班預排</div>
      </div>`,
      `<button class="btn btn-ghost" onclick="CM()">取消</button>
       <button class="btn btn-primary" onclick="saveCE()">確認</button>`);
    return;
  }
  // ── 休假日 preot（預排加班，stage2）：顯示確認預排 / 取消預排 ──
  if(!isWork && isPreOT){
    const ceOptsHTML = [
      `<div class="obtn s-ot${_cellSel==='__confirm__'?' sel':''}" onclick="pickCE('__confirm__',this)">✅ 確認預排加班</div>`,
      `<div class="obtn${_cellSel==='__cancel__'?' sel':''}" onclick="pickCE('__cancel__',this)">✕ 取消預排加班</div>`,
    ].join('');
    OM(`✏️ ${name} — ${dateStr}（預排加班）`,
      `<div class="minfo"><b>班別：</b>${mem.shift}　<b>目前：</b>預排加班</div>
      <div class="ogrid" id="ceOpts">${ceOptsHTML}</div>`,
      `<button class="btn btn-ghost" onclick="CM()">取消</button>
       <button class="btn btn-primary" onclick="saveCE()">確認</button>`);
    return;
  }

  // ── 一般格子 ──
  // 休假日：只顯示「預排加班」和「拒絕加班」
  // 上班日：顯示完整假別清單
  let ceOptsHTML;
  if(!isWork){
    // 休假日格子
    const _preotLabel=S.stage===3?'⚡ P加班預排（待確認）':'⚡ 預排加班';
    ceOptsHTML = [
      `<div class="obtn s-ot${_cellSel==='__preot__'?' sel':''}" onclick="pickCE('__preot__',this)">${_preotLabel}</div>`,
      `<div class="obtn${_cellSel==='__noot__'?' sel':''}" onclick="pickCE('__noot__',this)" style="background:#fee2e2;color:#dc2626">✕ 拒絕加班</div>`,
    ].join('');
  } else {
    const leaveOpts = [
      {k:'annual',l:'特休'},{k:'comp',l: hol?'報-補休':'補休'},
      {k:'sick',l:'病假'},{k:'physio',l:'生理假'},
      {k:'maternity',l:'產假'},{k:'family',l:'家庭照顧假'},
      {k:'infant',l:'幼兒照顧假'},{k:'funeral',l:'喪假'},
      {k:'personal',l:'事假'},
    ];
    let ceOptArr = [...leaveOpts];
    if(hol){ ceOptArr.push({k:'hol_ot',l:'報-加班費'}); ceOptArr.push({k:'hol_leave',l:'國假'}); }
    if(hol) ceOptArr = ceOptArr.map(o=>o.k==='comp'?{k:'hol_comp',l:'報-補休'}:o);
    ceOptsHTML = ceOptArr.map(o=>`<div class="obtn ${_cellSel===o.k?'sel':''}" onclick="pickCE('${o.k}',this)">${o.l}</div>`).join('');
  }
  const holInfo = hol ? `<div style="background:#fff8e1;border:1px solid #ffd54f;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:11px;">🎌 <b>${holName}</b>｜補休/預排休假-國假算休息，報-加班費算上班</div>` : '';
  OM(`✏️ ${name} — ${dateStr}`,
    `${holInfo}<div class="minfo"><b>班別：</b>${mem.shift}　<b>輪班：</b>${TL[s.base]}　<b>目前：</b>${TL[s.type]||s.type}</div>
    <span class="flabel">假別</span>
    <div class="ogrid ogrid3" id="ceOpts">${ceOptsHTML}</div>
    <span class="flabel">備註</span>
    <textarea class="finput" id="ceNote" rows="2" style="resize:none" placeholder="備註（選填）">${S.phase1[key]?.note||''}</textarea>
    <div style="margin-top:8px"><button class="btn btn-sm" style="color:#ef4444;background:#fef2f2;border:1px solid #fca5a5" onclick="clearCell('${name}','${dateStr}')">✕ 清除覆蓋</button></div>`,
    `<button class="btn btn-ghost" onclick="CM()">取消</button><button class="btn btn-primary" onclick="saveCE()">儲存</button>`);
}
function pickCE(t, el) {
  _cellSel = t;
  document.querySelectorAll('#ceOpts .obtn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}
function saveCE() {
  if(!_cellEdit) return;
  const { name, dateStr } = _cellEdit;
  const note = document.getElementById('ceNote')?.value.trim()||'';
  const mem = S.members.find(x => x.name===name);
  const base = shiftWork(pd(dateStr), mem.shift);
  const key = name+'_'+dateStr;
  const isPreOT = !!S.phase2[key];

  // ── 所有特殊動作（preOT/noOt/cancel）優先處理 ──
  if(_cellSel === '__preot__') {
    if(S.stage===3){
      // stage3：手動排加班 → 寫入 p3WaveStatus.draft（人員端顯示 P加班，需確認）
      if(!S.p3WaveStatus) S.p3WaveStatus={draft:{},confirmType:{}};
      if(!S.p3WaveStatus.draft) S.p3WaveStatus.draft={};
      S.p3WaveStatus.draft[key]=true;
      LS_save(); CM(); renderAdminTab(); toast('已設定 P加班預排（待人員確認）','ok');
    } else {
      // stage2：寫入 phase2，confirmed:false（待人員確認）
      S.phase2[key]={type:'ot',note:'',confirmed:false};
      LS_save(); CM(); renderAdminTab(); toast('已設定預排加班（待人員確認）','ok');
    }
    return;
  }
  if(_cellSel === '__cancel_p3draft__') {
    if(S.p3WaveStatus?.draft) delete S.p3WaveStatus.draft[key];
    LS_save(); CM(); renderAdminTab(); toast('已取消P加班預排','info'); return;
  }
  if(_cellSel === '__noot__') {
    const p1e=S.phase1[key]||{}; p1e.noOt=true; S.phase1[key]=p1e;
    LS_save(); CM(); renderAdminTab(); toast('已標記拒絕加班','ok'); return;
  }
  if(_cellSel === '__cancel_noot__') {
    const p1e=S.phase1[key]||{}; delete p1e.noOt;
    if(Object.keys(p1e).length===0) delete S.phase1[key]; else S.phase1[key]=p1e;
    LS_save(); CM(); renderAdminTab(); toast('已取消拒絕加班標記','ok'); return;
  }

  if(isPreOT) {
    if(_cellSel === '__confirm__') {
      S.phase3[key]={confirmed:true};
      toast('已確認加班','ok');
    } else if(_cellSel === '__cancel__') {
      delete S.phase2[key]; delete S.phase3[key]; delete S.phase1[key];
      toast('已取消預排加班','info');
    } else if(_cellSel === '__cancel_comp') {
      delete S.phase1[key];
      toast('已取消加班費申報','info');
    } else if(_cellSel === 'comp_off') {
      S.phase1[key] = { type:'comp_off', note:'加班報補休' };
      toast('已設定加班報-補休','ok');
    }
    LS_save(); CM(); renderAdminTab(); return;
  }

  if(_cellSel===base && !note) {
    delete S.phase1[key]; delete S.phase2[key]; delete S.phase3[key];
  } else if(['annual','sick','personal','comp','physio','maternity','family','infant','funeral','hol_leave','off','comp_off','hol_comp','hol_ot'].includes(_cellSel)) {
    S.phase1[key] = { type:_cellSel, note };
    delete S.phase2[key]; delete S.phase3[key];
  } else if(_cellSel==='ot') {
    S.phase2[key] = { type:'ot', note };
  } else {
    S.phase1[key] = { type:_cellSel, note };
  }
  LS_save(); CM(); renderAdminTab(); toast('已更新','ok');
}
function clearCell(name, dateStr) {
  delete S.phase1[name+'_'+dateStr];
  delete S.phase2[name+'_'+dateStr];
  delete S.phase3[name+'_'+dateStr];
  LS_save(); CM(); renderAdminTab(); toast('已清除','info');
}

function renderAdminDeficit(mc) {
  const { y, m } = S.schedMonth;
  const days = monthDays(y, m);
  let html = `<div class="sheet-toolbar">${moNavHTML()}</div>
  <div class="sheet-wrap"><table class="sheet"><thead>
    <tr><th class="col-no">#</th>
        <th class="col-id" style="position:sticky;top:0;z-index:45;text-align:left;padding-left:6px">班別</th>
        <th class="col-site" style="position:sticky;top:0;z-index:45">人數</th>
`;
  days.forEach(d => {
    const we = d.getDay()===0||d.getDay()===6;
    html += `<th style="min-width:46px;font-size:10px${we?';color:#c00':''}">
      ${d.getDate()}<br><span style="font-size:8px">${DOW[d.getDay()]}</span></th>`;
  });
  html += '</tr></thead><tbody>';
  SHIFTS.forEach((shift,si) => {
    const mems = S.members.filter(x => x.shift===shift);
    html += `<tr>
      <td class="col-no">${si+1}</td>
      <td class="col-id" style="text-align:left;padding-left:6px"><span style="font-weight:700">${shift}班</span></td>
      <td class="col-site">${mems.length}人</td>
`;
    days.forEach(d => {
      const base = shiftWork(d, shift);
      if(base==='off') { html+=`<td class="dc-off" style="font-size:10px">—</td>`; return; }
      let work=0, leave=[];
      mems.forEach(mem => {
        const s = getStatus(mem.name, d);
        if(['work','ot','preot'].includes(s.type)) work++;
        else leave.push(mem.name.slice(-1));
      });
      const activeTools = S.tools.filter(t => (t.status||'auto')!=='off').length;
      const total = activeTools || mems.length;
      const def=total-work;
      const cls=work>=total?'def-ok':work>=total-1?'def-warn':'def-bad';
      html+=`<td class="${cls}" style="font-size:11px;font-weight:700" title="${leave.join(',')}">${work}/${total}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  mc.innerHTML=html;
}

function autoPreOTP3(targetSf){
  // 第三階段預排：只針對 confirmType='continue' 的人員
  // 草稿寫入 p3WaveStatus.draft（key=name_date, value=true）
  if(!S.p3WaveStatus) S.p3WaveStatus={draft:{},confirmType:{}};
  const pairSf=pairShiftOf(targetSf);
  const {y,m}=S.schedMonth; const days=monthDays(y,m);
  const leaveTypes=['annual','sick','personal','physio','maternity','family','infant','funeral','hol_leave'];

  // 手動機台數（上限）
  const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');
  const maxOTPerDay=allActive.length - allActive.filter(t=>toolIsAuto(t)).length;

  // 只從 targetSf 中 confirmType='continue' 且尚未在第三階段確認的人員
  const eligiblePool=S.members.filter(m=>{
    if(m.shift!==targetSf) return false;
    if((m.skills||[]).includes('雙棲')) return false;
    const ct=S.p2WaveStatus?.confirmType?.[m.name];
    // p2 continue 或尚未送出 p2 的人員都可以參與 p3 預排
    if(S.p2WaveStatus?.finalSubmitted?.[m.name] && ct==='final') return false;
    return true;
  });

  const newDraft={...S.p3WaveStatus.draft};

  days.forEach(d=>{
    if(shiftWork(d,targetSf)!=='work') return; // 只在 targetSf 上班日
    const dateStr=dk(d);

    // pairSf 當天出勤人數（含 confirmed p2 加班）
    const pairOnDutyMembers=S.members.filter(mem=>{
      if(mem.shift!==pairSf) return false;
      const s=getStatus(mem.name,d);
      return s.base==='work'&&isActuallyWorking(s,dateStr);
    });
    const dispatchP=pairOnDutyMembers.filter(m=>(m.skills||[]).includes('派工')||(m.skills||[]).includes('代理')).length;
    const pairOnDuty=pairOnDutyMembers.length-dispatchP;

    // targetSf 已預排加班人數（p2 confirmed + p3 requests + 本次草稿）
    const alreadyOT=S.members.filter(mem=>{
      if(mem.shift!==targetSf) return false;
      return !!S.phase2[mem.name+'_'+dateStr]||!!S.p3Requests[mem.name+'_'+dateStr]||!!newDraft[mem.name+'_'+dateStr];
    }).length;

    const need=Math.max(0, maxOTPerDay - pairOnDuty - alreadyOT);
    if(need<=0) return;

    const avail=eligiblePool.filter(mem=>{
      if(shiftWork(d,mem.shift)!=='off') return false;
      const s=getStatus(mem.name,d);
      if(leaveTypes.includes(s.type)) return false;
      if(S.phase2[mem.name+'_'+dateStr]) return false;
      if(S.p3Requests[mem.name+'_'+dateStr]) return false;
      if(S.p3FinalSubmitted?.[mem.name]) return false; // 已送出 p3 確認不再排
      if(newDraft[mem.name+'_'+dateStr]) return false;
      if(S.phase1[mem.name+'_'+dateStr]?.noOt) return false;
      if(S.p3WaveStatus?.confirmType?.[mem.name]==='final') return false; // p3 也已確認
      if(checkConsecWithPending(mem.name,d,newDraft)) return false;
      const holRules=checkWeekRules(mem.name,d,true);
      if(holRules.holAllOT) return false;
      return true;
    });
    if(!avail.length) return;

    const shuffled=[...avail].sort(()=>Math.random()-0.5);
    shuffled.slice(0,need).forEach(mem=>{
      newDraft[mem.name+'_'+dateStr]=true;
    });
  });

  S.p3WaveStatus.draft=newDraft;
  LS_save(); renderAdminTab();
  const newCount=Object.keys(newDraft).length;
  toast(`${targetSf} 第三階段草稿：${newCount} 筆（繼續安排人員），請通知人員確認`,'ok');
}

    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="showMachineOffMgr()">⚙ 停機</button>
  </div>

    ...S.members.filter(x=>x.shift===grp[0]).sort((a,b)=>a.id-b.id),
    ...S.members.filter(x=>x.shift===grp[1]).sort((a,b)=>a.id-b.id),
  ];

    thead+=`<th style="min-width:46px;font-size:10px${we||hol?';color:#c00':''};background:${bg}">${d.getDate()}<br><span style="font-size:8px">${DOW[d.getDay()]}</span></th>`;

      lastSf=mem.shift;

    tbody+=`<tr>

      const noOt=!!(S.phase1[key]?.noOt);
      if(base==='off'&&!leaveTypes.includes(t)){

      // 出勤人數（排除請假）

      });

      const dispatchCount=onDutyMembers.filter(m=>(m.skills||[]).includes('派工')||(m.skills||[]).includes('代理')).length;

      }).length;
      // 缺額 = 手動機台數 - (出勤人數 - 派工人數) - 對班加班人數
      const deficit=Math.max(0,maxOT-(onDuty-dispatchCount)-offOT);
      const cls=deficit===0?'def-ok':deficit<=2?'def-warn':'def-bad';
      tfoot+=`<td class="${cls}" style="font-size:10px;font-weight:700;padding:2px 0;text-align:center" title="${onSf}出勤:${onDuty} ${offSf}加班:${offOT} 需:${maxOT}">${deficit>0?'-'+deficit:'✓'}</td>`;
    });
    tfoot+='</tr>';
  });
  tfoot+='</tfoot>';
  wrap.innerHTML=`<table class="sheet">${thead}${tbody}${tfoot}</table>`;

// 切換分頁：若有未存草稿自動取消

function _switchP2Tab(newSf){
  if(Object.keys(_p2Pending).length>0){
    if(!confirm(`切換頁面將取消目前的草稿（${Object.keys(_p2Pending).length}筆），確定切換？`)){return;}
    _p2Pending={};
  }
  _p2ShiftFilter=newSf;
  renderAdminTab();
}


function commitPreOT(){
  const grpNow=_p2ShiftFilter==='NA+NB'?['NA','NB']:['DA','DB'];
  const pendingToSave=Object.fromEntries(
    Object.entries(_p2Pending).filter(([key])=>{
      const name=key.slice(0,key.lastIndexOf('_'));
      const mem=S.members.find(x=>x.name===name);
      return mem&&grpNow.includes(mem.shift);
    })
  );
  if(Object.keys(pendingToSave).length===0){toast('目前沒有草稿可儲存','info');return;}
  // stage3：直接儲存到 p3WaveStatus.draft，跳過 over6/連七檢查（p3 無天數上限）
  if(S.stage===3){ _doCommitPreOT(false); return; }
  // stage2：先做 over6 / 連七檢查
  const over6=[];
  const overConsec=[];
  Object.entries(pendingToSave).forEach(([key,v])=>{
    if(v&&!S.phase2[key]) S.phase2[key]={type:'ot',note:'',_temp:true};
  });
  S.members.forEach(mem=>{
    const days=Object.keys(S.phase2).filter(k=>k.startsWith(mem.name+'_')).length;
    if(days>6) over6.push(`${mem.name}（${mem.shift}）${days}天`);
    const memberKeys=Object.keys(S.phase2).filter(k=>k.startsWith(mem.name+'_')&&S.phase2[k]?._temp);
    memberKeys.forEach(k=>{
      const ds=k.slice(mem.name.length+1);
      if(checkWeekRules(mem.name,pd(ds),false).consec){
        overConsec.push(`${mem.name} ${ds}`);
      }
    });
  });
  // 還原臨時注入
  Object.keys(S.phase2).forEach(k=>{ if(S.phase2[k]?._temp) delete S.phase2[k]; });

  const hasWarning=over6.length>0||overConsec.length>0;
  if(hasWarning){
    const warn1=over6.length>0?`<div style="margin-bottom:8px"><b style="color:#dc2626">超過六天：</b><br>${over6.map(s=>`<div style="font-size:11px;padding:2px 0">${s}</div>`).join('')}</div>`:'';
    const warn2=overConsec.length>0?`<div><b style="color:#dc2626">連七上班：</b><br>${[...new Set(overConsec)].map(s=>`<div style="font-size:11px;padding:2px 0">${s}</div>`).join('')}</div>`:'';
    OM('⚠ 草稿儲存前警告',`
      <div style="padding:8px;max-height:360px;overflow-y:auto">
        ${warn1}${warn2}
        <div style="color:#888;font-size:11px;margin-top:8px">「跳過並儲存」將跳過有問題的項目只儲存正常項目；「返回調整」不儲存任何草稿。</div>
      </div>`,
      `<button class="btn btn-ghost" onclick="CM()">↩ 返回調整（不儲存）</button>
       <button class="btn btn-warn" onclick="_doCommitPreOT(true)">跳過問題並儲存</button>
       <button class="btn btn-primary" onclick="_doCommitPreOT(false)">全部儲存</button>`);
  } else {
    _doCommitPreOT(false);
  }
}
function _doCommitPreOT(skipProblems){
  // 重新計算哪些要跳過
  const skipKeys=new Set();
  if(skipProblems){
    // 臨時注入再檢查
    Object.entries(_p2Pending).forEach(([key,v])=>{
      if(v&&!S.phase2[key]) S.phase2[key]={type:'ot',note:'',_temp:true};
    });
    Object.entries(_p2Pending).forEach(([key])=>{
      if(!S.phase2[key]?._temp) return;
      const name=key.slice(0,key.lastIndexOf('_'));
      const ds=key.slice(name.length+1);
      const days=Object.keys(S.phase2).filter(k=>k.startsWith(name+'_')).length;
      if(days>6||checkWeekRules(name,pd(ds),false).consec) skipKeys.add(key);
    });
    Object.keys(S.phase2).forEach(k=>{ if(S.phase2[k]?._temp) delete S.phase2[k]; });
  }
  let cnt=0;
  const grpDo=_p2ShiftFilter==='NA+NB'?['NA','NB']:['DA','DB'];
  const isStage3=S.stage===3;
  // stage3：寫入 p3WaveStatus.draft（人員端顯示為 P加班，可確認/取消）
  // stage2：寫入 S.phase2（人員端顯示為預排，需確認）
  if(isStage3 && !S.p3WaveStatus) S.p3WaveStatus={draft:{},confirmType:{}};
  if(isStage3 && !S.p3WaveStatus.draft) S.p3WaveStatus.draft={};
  Object.entries(_p2Pending).forEach(([key,v])=>{
    if(!v||skipKeys.has(key)) return;
    const name=key.slice(0,key.lastIndexOf('_'));
    const mem=S.members.find(x=>x.name===name);
    if(!mem||!grpDo.includes(mem.shift)) return;
    if(isStage3){
      // stage3：寫入 p3WaveStatus.draft
      if(!S.p3WaveStatus.draft[key]){ S.p3WaveStatus.draft[key]=true; cnt++; }
    } else {
      // stage2：寫入 phase2，confirmed:false（待人員確認）
      if(!S.phase2[key]){ S.phase2[key]={type:'ot',note:'',confirmed:false}; cnt++; }
    }
  });
  // 清除已儲存的群組草稿
  Object.keys(_p2Pending).forEach(key=>{
    const name=key.slice(0,key.lastIndexOf('_'));
    const mem=S.members.find(x=>x.name===name);
    if(mem&&grpDo.includes(mem.shift)) delete _p2Pending[key];
  });
  LS_save(); CM(); renderAdminTab();
  const dest=isStage3?'P加班草稿':'預排加班';
  toast(`${dest}已儲存 ${cnt} 筆${skipKeys.size>0?`，跳過 ${skipKeys.size} 筆問題項目`:''}`, 'ok');
}
function cancelPreOT(){
  _p2Pending={};
  renderAdminTab(); toast('已取消草稿','info');
}
function clearAllPreOT(){
  if(!confirm('確定清除本月所有預排加班記錄？')) return;
  const {y,m}=S.schedMonth; const days=monthDays(y,m);
  days.forEach(d=>{
    const dateStr=dk(d);
    S.members.forEach(mem=>{ delete S.phase2[mem.name+'_'+dateStr]; delete S.phase3[mem.name+'_'+dateStr]; });
  });
  _p2Pending={};
  LS_save(); renderAdminTab(); toast('已清除所有預排加班','info');
}
function autoPreOT(targetSf){
  // targetSf='NA' = 為 NB 班上班日補缺，從 NA 班休假人員中抽取
  targetSf = targetSf || _p2ShiftFilter;
  const pairSf = pairShiftOf(targetSf); // NA→NB, NB→NA, DA→DB, DB→DA
  // pairSf 是上班那班（計算缺額），targetSf 是提供加班人員的班
  const {y,m}=S.schedMonth; const days=monthDays(y,m);
  const leaveTypes=['annual','sick','personal','comp','physio','maternity','family','infant','funeral','hol_leave'];

  const allActive=S.tools.filter(t=>(t.status||'auto')!=='off');
  const maxOTPerDay=allActive.length - allActive.filter(t=>toolIsAuto(t)).length;

  const newPending={..._p2Pending};
  let totalNeed=0, totalAvail=0, totalPicked=0;

  days.forEach(d=>{
    // 只在 pairSf（上班班）的上班日處理
    if(shiftWork(d,pairSf)!=='work') return;
    const dateStr=dk(d);

    // pairSf 當天出勤人數（扣除派工：派工消耗整人力、不排機台）
    const onDutyMembers=S.members.filter(mem=>{
      if(mem.shift!==pairSf) return false;
      const s=getStatus(mem.name,d);
      return isActuallyWorking(s,dateStr);
    });
    const dispatchCount=onDutyMembers.filter(m=>(m.skills||[]).includes('派工')||(m.skills||[]).includes('代理')).length;
    const onDutyCount=onDutyMembers.length - dispatchCount;

    // targetSf 已預排加班人數（已確認 + 草稿）
    const alreadyOT=S.members.filter(mem=>{
      if(mem.shift!==targetSf) return false;
      return !!S.phase2[mem.name+'_'+dateStr]||!!newPending[mem.name+'_'+dateStr];
    }).length;

    // 缺額 = 手動機台數 - (pairSf出勤 - 派工) - targetSf 已預排
    const need=Math.max(0, maxOTPerDay - onDutyCount - alreadyOT);
    totalNeed+=need;
    if(need<=0) return;

    // 從 targetSf 當天休假人員中抽取（targetSf 的休假日 = pairSf 的上班日）
    const avail=S.members.filter(mem=>{
      if(mem.shift!==targetSf) return false;
      if((mem.skills||[]).includes('雙棲')) return false;
      if(shiftWork(d,mem.shift)!=='off') return false; // targetSf 當天必須是休假日
      const s=getStatus(mem.name,d);
      if(leaveTypes.includes(s.type)) return false;
      if(S.phase2[mem.name+'_'+dateStr]) return false;
      if(newPending[mem.name+'_'+dateStr]) return false;
      if(S.phase1[mem.name+'_'+dateStr]?.noOt) return false;
      // confirmType='final' 的人不再參與預排加班
      if(S.p2WaveStatus?.confirmType?.[mem.name]==='final') return false;
      const existOT=Object.keys(S.phase2).filter(k=>k.startsWith(mem.name+'_')).length;
      const pendOT=Object.keys(newPending).filter(k=>k.startsWith(mem.name+'_')).length;
      if(existOT+pendOT>=6) return false;
      if(checkConsecWithPending(mem.name,d,newPending)) return false;
      const holRules=checkWeekRules(mem.name,d,true);
      if(holRules.holAllOT) return false;
      return true;
    });
    totalAvail+=avail.length;
    if(!avail.length) return;

    // 若 pairSf 有派工請假，優先排 targetSf 有派工/代理技能的人
    const pairDispatchLeaving=S.members.filter(m=>{
      if(m.shift!==pairSf) return false;
      if(!(m.skills||[]).includes('派工')) return false;
      const s=getStatus(m.name,d);
      return leaveTypes.includes(s.type)||s.base==='off';
    }).length;

    let sorted;
    if(pairDispatchLeaving>0){
      sorted=[
        ...avail.filter(m=>(m.skills||[]).includes('派工')),
        ...avail.filter(m=>!(m.skills||[]).includes('派工')&&(m.skills||[]).includes('代理')),
        ...[...avail.filter(m=>!(m.skills||[]).includes('派工')&&!(m.skills||[]).includes('代理'))].sort(()=>Math.random()-0.5),
      ];
    } else {
      sorted=[...avail].sort(()=>Math.random()-0.5);
    }

    sorted.slice(0, need).forEach(mem=>{
      newPending[mem.name+'_'+dateStr]=true;
      totalPicked++;
    });
  });

  _p2Pending=newPending;
  renderAdminTab();
  const msg=`${targetSf}→補${pairSf}：需求${totalNeed} 可用${totalAvail} 排入${totalPicked}`;
  toast(`自動預排草稿：${Object.keys(newPending).length}筆 (${msg})，確認後儲存`,'ok');
}


function togglePreOT(name,dateStr){
  if(S.phase1[name+'_'+dateStr]?.noOt){ toast('此日已被本人標記不接受加班，無法排入','err'); return; }
  const key=name+'_'+dateStr;
  const isStage3=S.stage===3;
  // 取消
  if(isStage3 ? !!(S.p3WaveStatus?.draft?.[key]) : !!S.phase2[key]){
    if(!confirm(`確定取消 ${name} ${dateStr} 的 P加班預排？`)) return;
    if(isStage3){
      if(S.p3WaveStatus?.draft) delete S.p3WaveStatus.draft[key];
    } else {
      delete S.phase2[key]; delete S.phase3[key];
    }
    LS_save(); renderAdminTab(); toast('已取消 P加班預排','info');
    return;
  }
  // 新增
  const rules = checkWeekRules(name, pd(dateStr), true);
  if(rules.consec){ toast('⚠ 此安排將導致連續7天以上上班，無法排入','err'); return; }
  if(rules.holAllOT && !confirm('⚠ 警告：當週所有國假均已排加班，確定繼續？')) return;
  if(isStage3){
    // stage3 → p3WaveStatus.draft（待人員確認）
    if(!S.p3WaveStatus) S.p3WaveStatus={draft:{},confirmType:{}};
